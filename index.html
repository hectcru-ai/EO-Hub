        await setOrderArchived(resNum, !order.archived);
        renderOrderDetail(resNum);
      });
    }

    content.querySelectorAll('[data-flag-toggle]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(!requireStaffAuth('flag an issue on this item')) return;
        flagOpenKey = btn.dataset.flagToggle;
        drawReadOnly();
      });
    });
    content.querySelectorAll('[data-flag-cancel]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ flagOpenKey = null; drawReadOnly(); });
    });
    content.querySelectorAll('[data-flag-save]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!requireStaffAuth('flag an issue on this item')) return;
        const key = btn.dataset.flagSave;
        const [ki, ii] = key.split('-').map(Number);
        const select = content.querySelector(`[data-flag-select="${key}"]`);
        const costInput = content.querySelector(`[data-flag-cost="${key}"]`);
        const statusEl = document.getElementById('flagStatusMsg');
        order.kits[ki].items[ii].issueType = select.value;
        if(costInput.value) order.kits[ki].items[ii].replacementCost = costInput.value;
        try{
          await saveOrder(order);
          flagOpenKey = null;
          drawReadOnly();
        }catch(err){
          statusEl.textContent = '⚠ Could not save — ' + err.message;
          statusEl.style.color = 'var(--danger)';
        }
      });
    });
  }
  drawReadOnly();
}

// The actual check-in workflow — staff re-verify each item against what's
// physically coming back, not just a static replay of what checkout said.
// Unlike the checkout-time checklist, nothing pre-checks itself here:
// every item starts exactly as it was left at checkout, and staff mark it
// off (or flag it) based on what's actually in front of them right now.
// Matches the actual fee categories and language from the Policy Manual —
// not invented figures. Fixed-fee items compute automatically; anything
// needing a real replacement-cost lookup (no price database here) gets a
// manual $ field instead of a guess.
const CHECKIN_ISSUE_TYPES = {
  '': { label: 'No issue', needsCost: false },
  'missing': { label: 'Missing', needsCost: false,
    email: (item) => `${item.item} was not returned. Per policy, an item is tracked as missing for 7 calendar days from the due date — if it isn't returned or located within that window, it's considered lost and the full replacement cost will be charged instead of ongoing late fees.` },
  'damaged_repairable': { label: 'Damaged (operable / repairable in-house)', needsCost: false, fixedFee: 30,
    email: (item) => `${item.item} was returned damaged. Per policy, the standard damage fee for an item that's still operable or repairable in-house is $30.00.` },
  'damaged_inoperable': { label: 'Damaged (not repairable in-house)', needsCost: true,
    email: (item, cost) => `${item.item} was returned damaged beyond in-house repair. Per policy, this means the full replacement cost applies${cost ? `: $${cost}` : ' (amount to be confirmed by the Manager)'}.` },
  'dirty': { label: 'Dirty', needsCost: false, fixedFee: 10,
    email: (item) => `${item.item} was returned dirty (smoke, dirt, chalk, sand, or fingerprints). Per policy, the cleaning fee is $10.00.` },
  'scratched_lens': { label: 'Scratched Lens', needsCost: true,
    email: (item, cost) => `${item.item} (lens) was returned scratched. Per policy, a scratched lens is considered unrepairable, and the replacement cost at used price applies${cost ? `: $${cost}` : ' (amount to be confirmed by the Manager)'}.` },
  'wet': { label: 'Wet / Waterlogged', needsCost: true,
    email: (item, cost) => `${item.item} was returned wet/waterlogged. Per policy, this is evaluated case-by-case and can go up to the full replacement cost${cost ? `: $${cost}` : ' (amount to be confirmed by the Manager)'}.` },
};

function computeLateFee(order){
  if(!order.lateReturn || !order.daysLate) return 0;
  const totalItems = (order.kits||[]).reduce((sum,k) => sum + (k.items||[]).length, 0);
  const dailyFee = Math.min(5 * totalItems, 50);
  return dailyFee * order.daysLate;
}

function generateInvoiceNumber(resNum){
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  return `INV-${resNum}-${stamp}`;
}

function invoiceLine(description, amount){
  const desc = amount !== null ? description + ' ' : description;
  const amountStr = amount !== null ? `$${amount.toFixed(2)}` : '';
  if(amount === null) return desc;
  const dots = Math.max(3, 60 - desc.length - amountStr.length);
  return desc + '.'.repeat(dots) + ' ' + amountStr;
}

function buildCheckInEmailDraft(order){
  const chargeLines = []; // [{desc, note, amount|null}]
  let hasFixedTotal = true;
  let total = 0;

  const lateFee = computeLateFee(order);
  if(lateFee > 0){
    chargeLines.push({
      desc: `Late return (${order.daysLate} day${order.daysLate==1?'':'s'})`,
      note: 'Per policy: $5.00/item/day, capped at $50.00/day combined.',
      amount: lateFee,
    });
    total += lateFee;
  }

  (order.kits||[]).forEach(k=>{
    (k.items||[]).forEach(it=>{
      if(!it.issueType) return;

      if(it.issueType === 'missing' && it.confirmedLost){
        const amount = parseFloat(it.replacementCost) || 0;
        total += amount;
        chargeLines.push({
          desc: `${it.item} — Confirmed Lost`,
          note: 'Per policy: the 7-day missing window closed without the item being found or returned — full replacement cost now applies.',
          amount,
        });
        return;
      }

      const def = CHECKIN_ISSUE_TYPES[it.issueType];
      if(!def || !def.email) return;
      let amount = null;
      if(def.fixedFee){ amount = def.fixedFee; total += amount; }
      else if(def.needsCost){
        if(it.replacementCost){ amount = parseFloat(it.replacementCost) || 0; total += amount; }
        else hasFixedTotal = false;
      }
      chargeLines.push({
        desc: `${it.item} — ${def.label}`,
        note: def.email(it, it.replacementCost).replace(/^.*?Per policy/, 'Per policy'),
        amount,
      });
    });
  });

  if(!chargeLines.length) return null;

  const invoiceNumber = generateInvoiceNumber(order.reservationNumber);
  const dateStr = new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
  const totalLabel = hasFixedTotal ? 'TOTAL' : 'TOTAL (partial — some amounts still TBD)';

  const subject = `[DRAFT — for review] Invoice ${invoiceNumber} — ${order.studentName}`;
  const body =
`INVOICE (DRAFT — FOR INTERNAL REVIEW, NOT YET SENT TO STUDENT)

Invoice #: ${invoiceNumber}
Date: ${dateStr}
Order: ${order.reservationNumber}
Student: ${order.studentName}

CHARGES
${'-'.repeat(60)}
${chargeLines.map(l => invoiceLine(l.desc, l.amount) + `\n  ${l.note}`).join('\n\n')}
${'-'.repeat(60)}
${invoiceLine(totalLabel, total)}

Payment: Business Office (busoff@regent.edu). Unpaid fees suspend Cheqroom access immediately; an academic hold is placed if unpaid by the end of the semester.

Generated by the EO Hub — review with Ivy before anything goes to the student.`;

  return { subject, body };
}

function renderCheckInVerificationUI(content, order){
  // Auto-calculate lateness from the expected return date, but only ONCE —
  // if lateReturn is already defined (true OR false), staff have already
  // interacted with this (possibly via Save Progress), so their choice wins.
  if(typeof order.lateReturn === 'undefined' && order.expectedReturnDate){
    const daysLate = Math.floor((new Date().setHours(0,0,0,0) - new Date(order.expectedReturnDate).setHours(0,0,0,0)) / 86400000);
    if(daysLate > 0){ order.lateReturn = true; order.daysLate = daysLate; }
  }
  function draw(){
    content.innerHTML = `
      <button class="btn secondary" id="backBtn" type="button">← Back</button>
      <div class="card" style="margin-top:12px;">
        <strong>${order.reservationNumber}</strong> — ${order.studentName}
        <span class="status-badge">checked out</span>
        ${order.checkoutTimestamp ? `<div style="font-size:12px; color:var(--text-faint); margin-top:6px;">Checked out: ${new Date(order.checkoutTimestamp).toLocaleString()}</div>` : ''}
        ${order.expectedReturnDate ? `<div style="font-size:12px; color:var(--text-faint);">Expected return: ${new Date(order.expectedReturnDate).toLocaleDateString()}</div>` : ''}

        <div class="card" style="border-left:3px solid var(--danger); margin:12px 0;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="checkinLateFlag" ${order.lateReturn?'checked':''}>
            <span>This order is being returned late</span>
          </label>
          <div id="checkinLateDaysRow" style="${order.lateReturn?'':'display:none;'} margin-top:8px;">
            <label style="font-size:12px; color:var(--text-faint);">Days late</label><br>
            <input type="number" id="checkinDaysLate" min="1" value="${order.daysLate||''}" style="width:100px;">
          </div>
          ${order.expectedReturnDate ? `<div class="media-hint">Calculated automatically from the expected return date — adjust if needed.</div>` : ''}
        </div>

        <div style="font-size:12.5px; color:var(--text-muted); margin:8px 0;">Verify each item against what's actually being returned. Uncheck anything missing, and flag any issue with the dropdown next to it.</div>

        ${(order.kits||[]).map((k, ki) => `
          <div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--line-soft);">
            <div style="font-weight:700; margin-bottom:6px;">${k.name}${k.unitId ? ` [Unit ${k.unitId}]` : ''}</div>
            ${(k.items||[]).map((it, ii) => `
              <div class="checklist-row" data-ki="${ki}" data-ii="${ii}" style="flex-wrap:wrap;">
                <input type="checkbox" ${it.checked?'checked':''} class="checkin-item-check">
                <span>${it.item}</span>
                ${it.optional ? '<span class="badge approval" style="margin-left:6px;">Optional / Per Request</span>' : ''}
                <select class="checkin-item-issue" data-ki="${ki}" data-ii="${ii}" style="margin-left:auto; font-size:12px;">
                  ${Object.entries(CHECKIN_ISSUE_TYPES).map(([key,def]) => `<option value="${key}" ${it.issueType===key?'selected':''}>${def.label}</option>`).join('')}
                </select>
                ${CHECKIN_ISSUE_TYPES[it.issueType||'']?.needsCost ? `<input type="number" class="checkin-item-cost" data-ki="${ki}" data-ii="${ii}" placeholder="$ cost" value="${it.replacementCost||''}" style="width:80px; font-size:12px;">` : ''}
                <input type="text" class="checkin-item-note" placeholder="note (optional)" value="${it.note||''}" style="font-size:12px; width:160px;">
              </div>
            `).join('') || '<div style="font-size:12.5px; color:var(--text-faint);">No itemized checklist saved for this kit.</div>'}
          </div>
        `).join('')}

        <div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--line-soft); font-size:12.5px; color:var(--text-muted);">
          <div>Student signature (at checkout): <strong style="color:var(--text);">${order.checkoutSignatureStudent || '(none recorded)'}</strong></div>
          <div>Staff signature (at checkout): <strong style="color:var(--text);">${order.checkoutSignatureStaff || '(none recorded)'}</strong></div>
        </div>

        <div style="margin-top:14px;">

    content.querySelectorAll('.checkin-item-check').forEach(cb=>{

        const row = e.target.closest('[data-ki]');
        order.kits[row.dataset.ki].items[row.dataset.ii].checked = e.target.checked;
      });
    });
    content.querySelectorAll('.checkin-item-note').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const row = e.target.closest('[data-ki]');
        order.kits[row.dataset.ki].items[row.dataset.ii].note = e.target.value;
      });
    });
    content.querySelectorAll('.checkin-item-issue').forEach(sel=>{
      sel.addEventListener('change', e=>{
        order.kits[e.target.dataset.ki].items[e.target.dataset.ii].issueType = e.target.value;
        draw(); // re-render so the $ cost field shows/hides correctly for the new issue type
      });
    });
    content.querySelectorAll('.checkin-item-cost').forEach(inp=>{
      inp.addEventListener('input', e=>{
        order.kits[e.target.dataset.ki].items[e.target.dataset.ii].replacementCost = e.target.value;
      });
    });

    document.getElementById('generateDraftBtn').addEventListener('click', ()=>{
      const draftArea = document.getElementById('emailDraftArea');
      const draft = buildCheckInEmailDraft(order);
      if(!draft){
        draftArea.innerHTML = `<div class="callout">No late fee or item issues flagged — nothing to draft. This order looks clean.</div>`;
        return;
      }
      draftArea.innerHTML = `
        <div class="card" style="border-left:3px solid var(--amber);">
          <strong>📧 Draft — for Hector &amp; Ivy's review, not the student</strong>
          <div style="margin-top:10px; font-size:12.5px; color:var(--text-faint);">Subject</div>
          <div style="font-size:13px; margin-bottom:8px;">${draft.subject}</div>
          <div style="font-size:12.5px; color:var(--text-faint);">Body</div>
          <div style="font-size:13px; white-space:pre-wrap; background:var(--bg); border:1px solid var(--line-soft); border-radius:6px; padding:10px; margin-top:4px;">${draft.body}</div>
          <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn secondary" id="copyDraftBtn" type="button">📋 Copy Text</button>
          </div>
        </div>
      `;
      document.getElementById('copyDraftBtn').addEventListener('click', ()=>{
        navigator.clipboard.writeText(`Subject: ${draft.subject}\n\n${draft.body}`);
        const btn = document.getElementById('copyDraftBtn');
        btn.textContent = '✅ Copied';
        setTimeout(()=>{ btn.textContent = '📋 Copy Text'; }, 2000);
      });
    });

    document.getElementById('checkInBtn').addEventListener('click', async ()=>{
      if(!requireStaffAuth('complete a check-in')) return;
      const statusEl = document.getElementById('checkinStatusMsg');
      const staffSig = document.getElementById('checkinStaffSigInput').value.trim();
      if(!staffSig){
        statusEl.textContent = '⚠ Staff signature is required before completing check-in.';
        statusEl.style.color = 'var(--danger)';
        return;
      }
      order.checkinSignatureStaff = staffSig;
      order.status = 'checked_in';
      order.checkinTimestamp = new Date().toISOString();
      try{
        await saveOrder(order);
        renderOrderDetail(order.reservationNumber);
      }catch(err){
        order.status = 'checked_out';
        order.checkinTimestamp = null;
        order.checkinSignatureStaff = null;
        statusEl.textContent = '⚠ Could not save — ' + err.message;
        statusEl.style.color = 'var(--danger)';
      }
    });

    document.getElementById('saveProgressBtn').addEventListener('click', async ()=>{
      if(!requireStaffAuth('save check-in progress')) return;
      const statusEl = document.getElementById('checkinStatusMsg');
      // Deliberately does NOT touch status/checkinTimestamp/checkinSignatureStaff —
      // this stays "checked out" so it keeps showing up as needing check-in,
      // it just remembers everything checked/flagged so far.
      const staffSigSoFar = document.getElementById('checkinStaffSigInput').value.trim();
      if(staffSigSoFar) order.checkinSignatureStaff = staffSigSoFar;
      try{
        await saveOrder(order);
        statusEl.textContent = '✅ Progress saved — pick this order back up anytime from Check-In / Lookup, exactly where you left off.';
        statusEl.style.color = 'var(--success)';
      }catch(err){
        statusEl.textContent = '⚠ Could not save — ' + err.message;
        statusEl.style.color = 'var(--danger)';
      }
    });
  }
  draw();
}

let checkinReviewSearchTerm = '';
let checkinReviewShowResolved = false;
let openReviewOrderId = null;

async function renderCheckInReviewPage(){
  const el = document.getElementById('page-checkinreview');
  if(!currentStaffUser){
    el.innerHTML = `
      <div class="callout">This tab holds student-specific fee and issue data — staff login required just to view it, not only to act on it.</div>
      <button class="btn" id="reviewLoginBtn" type="button">Staff Login</button>
    `;
    document.getElementById('reviewLoginBtn').addEventListener('click', openLoginModal);
    return;
  }

  el.innerHTML = `<div class="callout">Loading flagged check-ins…</div>`;
  const flagged = await getFlaggedCheckIns();

  el.innerHTML = `
    <div class="callout">Every check-in that had a late return or an item issue flagged — anything that produced (or should produce) a draft for your and Ivy's review.</div>
    <input type="text" id="checkinReviewSearch" placeholder="Search by reservation # or student name…" style="width:100%; margin-bottom:10px;" value="${checkinReviewSearchTerm}">
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:14px; cursor:pointer;">
      <input type="checkbox" id="checkinReviewShowResolvedBox" ${checkinReviewShowResolved?'checked':''}>
      Also show orders already marked reviewed or archived
    </label>
    <div id="checkinReviewList"></div>
  `;
  document.getElementById('checkinReviewSearch').addEventListener('input', e=>{ checkinReviewSearchTerm = e.target.value.toLowerCase(); drawCheckinReviewList(flagged); });
  document.getElementById('checkinReviewShowResolvedBox').addEventListener('change', e=>{ checkinReviewShowResolved = e.target.checked; drawCheckinReviewList(flagged); });
  drawCheckinReviewList(flagged);
}

function drawCheckinReviewList(flagged){
  const listEl = document.getElementById('checkinReviewList');
  const term = checkinReviewSearchTerm;
  const visible = flagged.filter(order => {
    if(!checkinReviewShowResolved && (order.reviewResolved || order.archived)) return false;
    if(term) return order.reservationNumber.toLowerCase().includes(term) || (order.studentName||'').toLowerCase().includes(term);
    return true;
  });

  if(!visible.length){
    listEl.innerHTML = '<div class="empty-state">Nothing to show right now.</div>';
    return;
  }

  listEl.innerHTML = visible.map(order => {
    const isOpen = openReviewOrderId === order.reservationNumber;
    const draft = buildCheckInEmailDraft(order);
    const missingItems = [];
    (order.kits||[]).forEach((k, ki) => (k.items||[]).forEach((it, ii) => {
      if(it.issueType === 'missing' && !it.missingResolved) missingItems.push({k, ki, ii, it});
    }));
    const daysSinceCheckin = order.checkinTimestamp ? Math.floor((Date.now() - new Date(order.checkinTimestamp)) / 86400000) : null;

    return `
      <div class="card" data-res-card="${order.reservationNumber}" style="cursor:pointer;">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <strong>${highlightMatch(order.reservationNumber, term)}</strong> — ${highlightMatch(order.studentName||'', term)}
          ${order.lateReturn ? `<span class="badge blocked">${order.daysLate} day${order.daysLate==1?'':'s'} late</span>` : ''}
          ${missingItems.length ? `<span class="badge blocked">${missingItems.length} item${missingItems.length==1?'':'s'} missing</span>` : ''}
          ${order.reviewResolved ? `<span class="badge ok">✅ Reviewed</span>` : ''}
          ${order.archived ? `<span class="status-badge" style="background:#6E6C61; color:#fff;">ARCHIVED</span>` : ''}
          <span style="font-size:11px; color:var(--text-faint); margin-left:auto;">Checked in ${order.checkinTimestamp ? new Date(order.checkinTimestamp).toLocaleDateString() : '—'} ${isOpen ? '▲' : '▼'}</span>
        </div>

        ${isOpen ? `
        ${missingItems.length ? `
          <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line-soft);">
            ${missingItems.map(({k, ki, ii, it}) => `
              <div class="checklist-row" data-ki="${ki}" data-ii="${ii}" data-res="${order.reservationNumber}">
                <span>⚠ ${it.item} <span style="color:var(--text-faint);">(${k.name})</span></span>
                <span style="margin-left:8px; font-size:12px; color:var(--text-faint);">${daysSinceCheckin === null ? '' : `${daysSinceCheckin} day${daysSinceCheckin==1?'':'s'} since check-in`}</span>
                <div style="margin-left:auto; display:flex; gap:6px; align-items:center;">
                  ${it.confirmedLost ? `
                    <span class="badge blocked">❌ Confirmed Lost — $${it.replacementCost}</span>
                    <button class="media-btn" data-action="copyresolved" type="button">📋 Copy Text</button>
                  ` : `
                    <button class="media-btn" data-action="found" type="button">✅ Found</button>
                    <button class="media-btn danger" data-action="lost" type="button">❌ Confirmed Lost</button>
                  `}
                </div>
              </div>
              <div id="resolve-msg-${order.reservationNumber}-${ki}-${ii}" style="font-size:12.5px; margin:4px 0 8px;"></div>
            `).join('')}
          </div>
        ` : ''}

        <button class="media-btn" data-action="toggledraft" type="button" style="margin-top:10px;">View Draft</button>
        <div class="draft-toggle-area" style="display:none; margin-top:10px;">
          ${draft ? `
            <div style="font-size:12.5px; color:var(--text-faint);">Subject</div>
            <div style="font-size:13px; margin-bottom:6px;">${draft.subject}</div>
            <div style="font-size:12.5px; color:var(--text-faint);">Body</div>
            <div style="font-size:13px; white-space:pre-wrap; background:var(--bg); border:1px solid var(--line-soft); border-radius:6px; padding:10px;">${draft.body}</div>
            <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn secondary" data-copy-draft="${order.reservationNumber}" type="button">📋 Copy Text</button>
            </div>
          ` : '<div style="font-size:12.5px; color:var(--text-faint);">No draft content — this order only shows here because of an unresolved missing item above.</div>'}
        </div>

        <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line-soft);">
          <div style="font-size:12px; color:var(--text-faint); text-transform:uppercase; margin-bottom:6px;">Follow-Up Tracking</div>
          ${FOLLOWUP_FIELDS.map(f => `
            <label style="display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:6px; cursor:pointer;">
              <input type="checkbox" class="followup-check" data-res="${order.reservationNumber}" data-field="${f.key}" ${order.followUp && order.followUp[f.key] ? 'checked' : ''}>
              ${f.label}
            </label>
          `).join('')}
        </div>

        <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line-soft); display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn secondary" data-action="markreviewed" data-res="${order.reservationNumber}" type="button">${order.reviewResolved ? '↩ Unmark Reviewed' : '✅ Mark Reviewed'}</button>
          <button class="btn secondary" data-action="archivereview" data-res="${order.reservationNumber}" type="button">${order.archived ? '↩ Un-archive' : '📦 Archive'}</button>
        </div>
        ` : ''}
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('[data-res-card]').forEach(card=>{
    card.addEventListener('click', ()=>{
      const resNum = card.dataset.resCard;
      openReviewOrderId = (openReviewOrderId === resNum) ? null : resNum;
      drawCheckinReviewList(flagged);
    });
  });

  listEl.querySelectorAll('[data-action="toggledraft"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const area = btn.nextElementSibling;
      area.style.display = area.style.display === 'none' ? '' : 'none';
    });
  });

  listEl.querySelectorAll('[data-copy-draft]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const matchOrder = flagged.find(o => o.reservationNumber === btn.dataset.copyDraft);
      const matchDraft = matchOrder ? buildCheckInEmailDraft(matchOrder) : null;
      if(!matchDraft) return;
      navigator.clipboard.writeText(`Subject: ${matchDraft.subject}\n\n${matchDraft.body}`);
      btn.textContent = '✅ Copied';
      setTimeout(()=>{ btn.textContent = '📋 Copy Text'; }, 2000);
    });
  });

  listEl.querySelectorAll('[data-action="found"]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!requireStaffAuth('resolve a missing item')) return;
      const row = btn.closest('[data-res]');
      try{
        await resolveMissingItem(row.dataset.res, parseInt(row.dataset.ki), parseInt(row.dataset.ii), 'found');
        renderCheckInReviewPage();
      }catch(err){
        const msgEl = document.getElementById(`resolve-msg-${row.dataset.res}-${row.dataset.ki}-${row.dataset.ii}`);
        msgEl.textContent = '⚠ Could not save — ' + err.message;
        msgEl.style.color = 'var(--danger)';
      }
    });
  });

  listEl.querySelectorAll('[data-action="lost"]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!requireStaffAuth('confirm an item lost')) return;
      const row = btn.closest('[data-res]');
      const cost = prompt('Replacement cost for this item (per policy, full replacement cost now applies):');
      if(cost === null) return;
      try{
        await resolveMissingItem(row.dataset.res, parseInt(row.dataset.ki), parseInt(row.dataset.ii), 'lost', cost);
        renderCheckInReviewPage();
      }catch(err){
        const msgEl = document.getElementById(`resolve-msg-${row.dataset.res}-${row.dataset.ki}-${row.dataset.ii}`);
        msgEl.textContent = '⚠ Could not save — ' + err.message;
        msgEl.style.color = 'var(--danger)';
      }
    });
  });

  listEl.querySelectorAll('[data-action="copyresolved"]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const row = btn.closest('[data-res]');
      const freshOrder = await getOrder(row.dataset.res);
      const draft = buildCheckInEmailDraft(freshOrder);
      if(!draft) return;
      navigator.clipboard.writeText(`Subject: ${draft.subject}\n\n${draft.body}`);
      btn.textContent = '✅ Copied';
      setTimeout(()=>{ btn.textContent = '📋 Copy Text'; }, 2000);
    });
  });

  listEl.querySelectorAll('.followup-check').forEach(cb=>{
    cb.addEventListener('click', (e)=>e.stopPropagation());
    cb.addEventListener('change', async (e)=>{
      if(!requireStaffAuth('update follow-up tracking')){ e.target.checked = !e.target.checked; return; }
      const resNum = e.target.dataset.res;
      const field = e.target.dataset.field;
      const checked = e.target.checked;
      try{
        const freshOrder = await getOrder(resNum);
        freshOrder.followUp = freshOrder.followUp || {};
        freshOrder.followUp[field] = checked;
        await saveOrder(freshOrder);
      }catch(err){
        e.target.checked = !checked;
        alert('⚠ Could not save — ' + err.message);
      }
    });
  });

  listEl.querySelectorAll('[data-action="markreviewed"]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!requireStaffAuth('mark a check-in reviewed')) return;
      try{
        const freshOrder = await getOrder(btn.dataset.res);
        freshOrder.reviewResolved = !freshOrder.reviewResolved;
        await saveOrder(freshOrder);
        renderCheckInReviewPage();
      }catch(err){
        alert('⚠ Could not save — ' + err.message);
      }
    });
  });

  listEl.querySelectorAll('[data-action="archivereview"]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!requireStaffAuth('archive or un-archive an order')) return;
      try{
        const freshOrder = await getOrder(btn.dataset.res);
        await setOrderArchived(btn.dataset.res, !freshOrder.archived);
        renderCheckInReviewPage();
      }catch(err){
        alert('⚠ Could not save — ' + err.message);
      }
    });
  });
}

function cheqroomMatches(section){
  if(!cheqroomSearchTerm) return true;
  const hay = (section.title + ' ' + section.body).toLowerCase();
  return hay.includes(cheqroomSearchTerm);
}

function drawCheqroomList(){
  const listEl = document.getElementById('cheqroomList');
  const term = cheqroomSearchTerm;
  const filtered = CHEQROOM_SECTIONS.filter(cheqroomMatches);
  listEl.innerHTML = filtered.length ? filtered.map(s => {
    const matchesTitle = !term || s.title.toLowerCase().includes(term);
    const isOpen = openCheqroomId === s.id;
    const matchOnlyInBody = term && !matchesTitle && !isOpen;
    return `
    <div class="card" data-cheq-id="${s.id}" style="cursor:pointer;">
      <div style="display:flex; align-items:center; gap:8px;">
        <strong>${highlightMatch(s.title, term)}</strong>
        ${matchOnlyInBody ? '<span class="badge approval">🔍 match below — click to see</span>' : ''}
        ${cheqroomVideoLinks[String(s.id)] ? '<span class="badge" style="background:var(--amber);color:#fff;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;margin-left:4px;">▶ Tutorial</span>' : ''}
        <span style="font-size:11px; color:var(--text-faint); margin-left:auto;">${s.updated}</span>
      </div>
      ${isOpen ? `
        <div style="margin-top:10px; font-size:14px; line-height:1.5;">
          ${s.officialLink ? `<p><a href="${s.officialLink}" target="_blank" rel="noopener">🔗 Cheqroom's own guide on this (opens in a new tab)</a></p>` : ''}
          ${highlightMatch(s.body, term)}
        </div>
        <button class="media-btn" data-toggle-cheq-video="${s.id}" type="button" style="margin-top:8px;">📹 ${openCheqroomVideoId === s.id ? 'Hide Video' : 'Manage Video'}</button>
        ${openCheqroomVideoId === s.id ? `<div id="cheq-video-pane-${s.id}" style="margin-top:10px;"></div>` : ''}
      ` : ''}
    </div>
  `;
  }).join('') : '<div class="empty-state">No Cheqroom training matches that search.</div>';

  listEl.querySelectorAll('[data-cheq-id]').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('[data-toggle-cheq-video]') || e.target.closest('[id^="cheq-video-pane-"]') || e.target.closest('a')) return;
      const id = parseInt(card.dataset.cheqId);
      openCheqroomId = (openCheqroomId === id) ? null : id;
      openCheqroomVideoId = null;
      drawCheqroomList();
    });
  });

  listEl.querySelectorAll('[data-toggle-cheq-video]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = parseInt(btn.dataset.toggleCheqVideo);
      openCheqroomVideoId = (openCheqroomVideoId === id) ? null : id;
      drawCheqroomList();
      if(openCheqroomVideoId === id) renderCheqroomVideoPane(id);
    });
  });

function renderCheqroomVideoPane(sectionId){
  const pane = document.getElementById(`cheq-video-pane-${sectionId}`);
  if(!pane) return;
  pane.addEventListener('click', (e)=>e.stopPropagation());
  const videoUrl = cheqroomVideoLinks[String(sectionId)];
  if(!videoUrl){
    pane.innerHTML = `
      <div class="video-empty">No walkthrough video yet.</div>
      <div class="video-input-row">
        <input type="text" placeholder="Paste a YouTube (Unlisted) or Vimeo embed link…" id="cheq-video-input-${sectionId}">
        <button class="media-btn" data-action="savecheqvideo" type="button">Save</button>
      </div>
      <div class="media-hint">A trainer's screen recording of this exact process in Cheqroom. Either the plain link or the full embed code YouTube gives you works.</div>`;
    pane.querySelector('[data-action="savecheqvideo"]').addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!requireStaffAuth('save a walkthrough video link')) return;
      let val = pane.querySelector(`#cheq-video-input-${sectionId}`).value.trim();
      if(!val) return;
      val = extractVideoUrl(val);
      if(!/^https?:\/\//i.test(val)) val = 'https://' + val;
      try{
        await setCheqroomVideoLink(sectionId, val);
        cheqroomVideoLinks[String(sectionId)] = val;
      }catch(e){
        alert('Could not save video link.'); return;
      }
      renderCheqroomVideoPane(sectionId);
    });
    return;
  }
  const cleanVideoUrl = escapeHtmlAttr(extractVideoUrl(videoUrl));
  pane.innerHTML = `
    <div class="video-frame-wrap"><iframe src="${cleanVideoUrl}" allowfullscreen></iframe></div>
    <div class="media-btn-row">
      <a class="media-btn" href="${cleanVideoUrl}" target="_blank" rel="noopener" style="text-decoration:none; display:inline-block;">🔗 Open Video Link Directly</a>
      <button class="media-btn danger" data-action="removecheqvideo" type="button">🗑️ Remove Video</button>
    </div>`;
  pane.querySelector('[data-action="removecheqvideo"]').addEventListener('click', async (e)=>{
    e.stopPropagation();
    if(!requireStaffAuth('remove a walkthrough video')) return;
    if(!confirm('Remove this walkthrough video?')) return;
    try{
      await removeCheqroomVideoLink(sectionId);
      delete cheqroomVideoLinks[String(sectionId)];
    }catch(e){
      alert('⚠ Could not remove — ' + e.message); return;
    }
    renderCheqroomVideoPane(sectionId);
  });
}

    });

function downloadEmbeddedFile(base64Data, filename, mimeType){
  try{
    const byteChars = atob(base64Data);
    const byteNumbers = new Array(byteChars.length);
    for(let i = 0; i < byteChars.length; i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type: mimeType});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){
    alert('⚠ Could not download this file. Try again, or ask for a fresh copy.');
  }
}

// ---------------- Trainee Progress Tracker ----------------
const TRAINING_MILESTONES = [
  {week:1, key:'w1-logins', label:'Staff logins set up (Dashboard, staff email, time card)'},
  {week:1, key:'w1-checkins', label:'Started supervised check-ins'},
  {week:2, key:'w2-cheqroom-checkins', label:'Cheqroom check-ins added (supervised)'},
  {week:3, key:'w3-cheqroom-overview', label:'Cheqroom software overview completed'},
  {week:3, key:'w3-tool-intro', label:'Introduced to the Staff tab and rest of the digital tool'},
  {week:3, key:'w3-practice-scenario', label:'Completed the full self-paced practice scenario (all 5 acts, using the Jordan Alvarez practice order)'},
  {week:4, key:'w4-building-orders', label:'Started building orders (supervised)'},
  {week:4, key:'w4-observed-checkout', label:'Observed a full checkout'},
  {week:4, key:'w4-checkin-1', label:'Support check-in #1 completed'},
  {week:5, key:'w5-assisting-checkouts', label:'Assisting checkouts'},
  {week:5, key:'w5-paperwork-training', label:'Pre-checkout paperwork training (permits, COIs, approvals)'},
  {week:6, key:'w6-first-checkout', label:'Ran first supervised checkout'},
  {week:6, key:'w6-checkout-paperwork', label:'Checkout paperwork training (who signs what)'},
  {week:7, key:'w7-tier1', label:'Tier 1 gear mastery checkpoint reached'},
  {week:8, key:'w8-handbook-quiz', label:'Passed Handbook/Policy quiz'},
  {week:8, key:'w8-checkin-2', label:'Support check-in #2 completed'},
  {week:9, key:'w9-cheqroom-quiz', label:'Passed Cheqroom quiz'},
  {week:10, key:'w10-tier2', label:'Tier 2 gear mastery checkpoint reached'},
  {week:12, key:'w12-paperwork-quiz', label:'Passed Paperwork quiz'},
  {week:13, key:'w13-unsupervised', label:'Ran first fully unsupervised check-in/order/checkout'},
  {week:13, key:'w13-trained-student', label:'Trained a student on self-checkout'},
  {week:14, key:'w14-final-quiz', label:'Passed Final quiz'},
  {week:14, key:'w14-unsupervised', label:'Fully unsupervised across all tasks'},
];

let traineeList = [];
let currentTraineeId = null;
let currentTraineeData = null;
let traineeTrackerTab = 'milestones';

async function loadTraineeList(){
  traineeList = await getAllTrainees();
  renderTraineeSelect();
}

function renderTraineeSelect(){
  const sel = document.getElementById('traineeSelect');
  if(!sel) return;
  const prevValue = currentTraineeId || '';
  sel.innerHTML = '<option value="">— Select a trainee —</option>' +
    traineeList.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  if(traineeList.some(t => String(t.id) === prevValue)) sel.value = prevValue;

  if(!sel.dataset.listenerAttached){
    sel.dataset.listenerAttached = 'true';
    sel.addEventListener('change', async (e)=>{ await selectTrainee(e.target.value); });
  }

  const addBtn = document.getElementById('addTraineeBtn');
  if(addBtn && !addBtn.dataset.listenerAttached){
    addBtn.dataset.listenerAttached = 'true';
    addBtn.addEventListener('click', async ()=>{
      if(!requireStaffAuth('add a trainee')) return;
      const input = document.getElementById('newTraineeName');
      const name = input.value.trim();
      if(!name) return;
      try{
        const newId = await addTrainee(name);
        input.value = '';
        await loadTraineeList();
        document.getElementById('traineeSelect').value = newId;
        await selectTrainee(newId);
      }catch(e){
        alert('⚠ Could not save — ' + e.message);
      }
    });
  }

  const mergeBtn = document.getElementById('mergeDuplicatesBtn');
  if(mergeBtn && !mergeBtn.dataset.listenerAttached){
    mergeBtn.dataset.listenerAttached = 'true';
    mergeBtn.addEventListener('click', async ()=>{
      if(!requireStaffAuth('clean up duplicate trainees')) return;
      const msgEl = document.getElementById('mergeDuplicatesMsg');
      if(!confirm('This scans all trainees, merges progress for any sharing the exact same name, and deletes the extras. Nothing marked done gets lost — proceed?')) return;
      msgEl.textContent = 'Checking for duplicates…';
      msgEl.style.color = 'var(--text-muted)';
      try{
        const summary = await mergeDuplicateTrainees();
        if(!summary.length){
          msgEl.textContent = '✅ No duplicates found.';
        } else {
          msgEl.textContent = '✅ Cleaned up: ' + summary.map(s => `${s.name} (removed ${s.duplicatesRemoved} duplicate${s.duplicatesRemoved===1?'':'s'})`).join(', ');
        }
        msgEl.style.color = 'var(--success)';
        await loadTraineeList();
      }catch(e){
        msgEl.textContent = '⚠ Could not clean up — ' + e.message;
        msgEl.style.color = 'var(--danger)';
      }
    });
  }

  if(currentTraineeId) renderTraineeTracker();
}

async function selectTrainee(id){
  currentTraineeId = id || null;
  if(!currentTraineeId){
    currentTraineeData = null;
    document.getElementById('traineeTrackerBody').innerHTML = '';
    return;
  }
  currentTraineeData = await getTrainee(currentTraineeId);
  renderTraineeTracker();
}

function renderTraineeTracker(){
  const body = document.getElementById('traineeTrackerBody');
  if(!body) return;
  if(!currentTraineeId || !currentTraineeData){ body.innerHTML = ''; return; }

  const milestones = currentTraineeData.milestones || {};
  const kits = currentTraineeData.kits || {};
  const milestonesDone = Object.values(milestones).filter(Boolean).length;
  const kitsDone = Object.values(kits).filter(Boolean).length;

  body.innerHTML = `
    <div class="trainee-progress-summary">
      <div class="trainee-progress-stat"><span class="num">${milestonesDone}/${TRAINING_MILESTONES.length}</span><span class="label">Milestones</span></div>
      <div class="trainee-progress-stat"><span class="num">${kitsDone}/${ALL_KITS.length}</span><span class="label">Kits Mastered</span></div>
    </div>
    <div class="trainee-tab-row">
      <button class="trainee-tab-btn ${traineeTrackerTab==='milestones'?'active':''}" data-tt-tab="milestones" type="button">Weekly Milestones</button>
      <button class="trainee-tab-btn ${traineeTrackerTab==='kits'?'active':''}" data-tt-tab="kits" type="button">Gear Mastery</button>
    </div>
    <div id="traineeTrackerContent"></div>
  `;
  body.querySelectorAll('[data-tt-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ traineeTrackerTab = btn.dataset.ttTab; renderTraineeTracker(); });
  });

  const content = document.getElementById('traineeTrackerContent');
  if(traineeTrackerTab === 'milestones'){
    const weeks = [...new Set(TRAINING_MILESTONES.map(m=>m.week))];
    content.innerHTML = weeks.map(w => `
      <div class="milestone-week-block">
        <div class="milestone-week-title">Week ${w}</div>
        ${TRAINING_MILESTONES.filter(m=>m.week===w).map(m => {
          const done = !!milestones[m.key];
          return `<div class="milestone-item ${done?'done':''}">
            <input type="checkbox" id="ms-${m.key}" data-milestone-key="${m.key}" ${done?'checked':''}>
            <label for="ms-${m.key}">${m.label}</label>
          </div>`;
        }).join('')}
      </div>
    `).join('');
    content.querySelectorAll('[data-milestone-key]').forEach(cb=>{
      cb.addEventListener('change', async (e)=>{
        if(!requireStaffAuth('update a trainee\'s progress')){ e.target.checked = !e.target.checked; return; }
        const key = e.target.dataset.milestoneKey;
        const newVal = e.target.checked;
        try{
          await setTraineeMilestone(currentTraineeId, key, newVal);
          currentTraineeData.milestones[key] = newVal;
          renderTraineeTracker();
        }catch(err){
          e.target.checked = !newVal;
          alert('⚠ Could not save — ' + err.message);
        }
      });
    });
  } else {
    const sortedKits = [...ALL_KITS].sort((a,b)=>a.name.localeCompare(b.name));
    content.innerHTML = `<div class="kit-mastery-grid">${sortedKits.map(k => {
      const done = !!kits[k.id];
      return `<div class="kit-mastery-item ${done?'mastered':''}">
        <input type="checkbox" id="km-${k.id}" data-kit-key="${k.id}" ${done?'checked':''}>
        <label for="km-${k.id}">${k.name}</label>
      </div>`;
    }).join('')}</div>`;
    content.querySelectorAll('[data-kit-key]').forEach(cb=>{
      cb.addEventListener('change', async (e)=>{
        if(!requireStaffAuth('update a trainee\'s progress')){ e.target.checked = !e.target.checked; return; }
        const key = e.target.dataset.kitKey;
        const newVal = e.target.checked;
        try{
          await setTraineeKitMastery(currentTraineeId, key, newVal);
          currentTraineeData.kits[key] = newVal;
          renderTraineeTracker();
        }catch(err){
          e.target.checked = !newVal;
          alert('⚠ Could not save — ' + err.message);
        }
      });
    });
  }
}

// ---------------- Rooms ----------------
function renderRoomsPage(){
  const el = document.getElementById('page-rooms');
  el.innerHTML = `
    <div class="callout">Reserve a room remotely from any device — no need to walk up to the QR code on the door.</div>
    <div class="card">${ROOM_RESERVATION_RULES}</div>
    <div class="room-grid">
      ${ROOMS.map(r => `
        <div class="room-card">
          ${r.photoDataUrl ? `<img src="${r.photoDataUrl}" alt="${r.name}">` : `<div class="room-photo-missing">No photo yet</div>`}
          <div class="room-body">
            <div class="room-name">${r.name}</div>
            ${r.reserveUrl ? `<a class="btn room-reserve-btn" href="${r.reserveUrl}" target="_blank" rel="noopener">Reserve This Room</a>` : `<div class="room-reserve-pending">Reservation link coming soon</div>`}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

async function init(){
  ALL_KITS = await getAllKits();
  try{
    kitMediaIndex = await getMediaIndex();
  }catch(e){
    kitMediaIndex = {};
    console.warn('Could not load kit media status (check Firestore rules for the kitMedia collection):', e.message);
  }
  try{
    openConditionLogs = await getAllOpenConditionLogs();
  }catch(e){
    openConditionLogs = [];
    console.warn('Could not load open condition logs:', e.message);
  }
  renderOrdersPage();
  renderKitsPage();
  renderIndexPage();
}
init();
</script>
</body>
</html>
