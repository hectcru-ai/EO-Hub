<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regent Equipment Office</title>
<style>
  :root{
    --bg:#F7F6F2; --panel:#FFFFFF; --line:#DEDBD2; --line-soft:#EAE7E0;
    --text:#28271F; --text-muted:#6E6C61; --text-faint:#9A978A;
    --amber:#C6862A; --amber-dim:#8A662C; --danger:#B23B3B; --success:#2E8B5C;
    --freshman:#4CAF7A; --sophomore:#3F93D1; --junior:#9B72CC; --senior:#C6862A; --special:#9DA0A6;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Arial,sans-serif; font-size:15px;}
  .header{border-bottom:1px solid var(--line); background:var(--panel); padding:20px 28px;}
  .header h1{font-size:26px; margin:0; font-weight:800;}
  .header h1 span{color:var(--amber);}
  .tab-nav{max-width:1180px; margin:0 auto; display:flex; gap:4px; padding:0 28px; border-bottom:1px solid var(--line); background:var(--panel);}
  .tab-btn{background:none; border:none; border-bottom:2px solid transparent; padding:14px 4px; margin-right:24px; font-size:14px; font-weight:600; color:var(--text-faint); cursor:pointer;}
  .tab-btn.active{color:var(--amber); border-bottom-color:var(--amber);}
  .page{max-width:1180px; margin:0 auto; padding:24px 28px 60px;}
  .callout{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:6px; padding:14px 16px; margin-bottom:20px; font-size:13.5px; color:var(--text-muted);}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px 18px; margin-bottom:12px;}
  input, select, textarea, button{font-family:inherit;}
  input, select, textarea{background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:9px 12px; font-size:14px; color:var(--text);}
  .btn{background:var(--amber); color:#fff; border:none; border-radius:6px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn:hover{background:var(--amber-dim);}
  .btn.secondary{background:transparent; color:var(--text); border:1px solid var(--line);}
  .grade-chip{display:inline-block; padding:6px 14px; border-radius:20px; border:1px solid var(--line); margin-right:6px; cursor:pointer; font-size:13px;}
  .grade-chip.active{background:var(--amber); color:#fff; border-color:var(--amber);}
  .kit-card{border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:8px; background:var(--panel);}
  .kit-name{font-weight:700;}
  .badge{font-size:10.5px; text-transform:uppercase; padding:2px 8px; border-radius:20px; margin-left:8px;}
  .badge.ok{background:rgba(46,139,92,0.12); color:var(--success);}
  .badge.blocked{background:rgba(178,59,59,0.1); color:var(--danger);}
  .badge.approval{background:rgba(198,134,42,0.14); color:var(--amber-dim);}
  .empty-state{color:var(--text-faint); padding:20px; text-align:center;}
  .order-field-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .selected-kit-chip{display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:5px 12px; margin:4px 4px 4px 0; font-size:13px;}
  .status-badge{font-size:11px; text-transform:uppercase; padding:3px 9px; border-radius:20px; background:var(--line-soft); margin-left:8px;}
  .sync-indicator{font-size:11px; color:var(--success); display:inline-flex; align-items:center; gap:4px;}
  .checklist-row{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line-soft);}
  .card ol, .card ul{padding-left:20px;}
  .card li{margin-bottom:6px;}
  .card .callout{margin-top:10px;}
  .card code{background:var(--bg); padding:2px 6px; border-radius:4px; font-size:12.5px;}
  .tape{
    font-family:monospace; font-size:10px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;
    color:#1B1D21; padding:4px 9px; border-radius:4px; white-space:nowrap; flex-shrink:0;
  }
  .tape[data-tier="freshman"]{background:var(--freshman);}
  .tape[data-tier="sophomore"]{background:var(--sophomore);}
  .tape[data-tier="junior"]{background:var(--junior);}
  .tape[data-tier="senior"]{background:var(--senior);}
  .tape[data-tier="special"]{background:var(--special);}
  .item-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .detail-row{display:flex; gap:8px; font-size:12.5px; padding:3px 0;}
  .detail-row .detail-label{color:var(--text-faint); min-width:150px; flex-shrink:0;}
  .detail-row .detail-value.empty{color:var(--text-faint); font-style:italic;}
  .note-flag{color:var(--danger); font-size:12.5px; margin-top:6px;}
  .qa{margin-bottom:12px; font-size:14px; line-height:1.5;}
  .qa .q{font-weight:700; margin-bottom:2px;}
  .trainee-select-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .trainee-select-row select{min-width:200px;}
  .trainee-select-row input{flex:1; min-width:160px;}
  .trainee-progress-summary{
    display:flex; gap:22px; flex-wrap:wrap; margin-bottom:16px; padding:12px 14px;
    background:rgba(0,0,0,0.02); border-radius:6px; border:1px solid var(--line-soft);
  }
  .trainee-progress-stat{display:flex; flex-direction:column; gap:2px;}
  .trainee-progress-stat .num{font-family:monospace; font-size:20px; font-weight:700; color:var(--amber);}
  .trainee-progress-stat .label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.03em;}
  .milestone-week-block{margin-bottom:14px;}
  .milestone-week-title{font-family:monospace; font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px;}
  .milestone-item{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:14px;}
  .milestone-item.done label{color:var(--text-faint); text-decoration:line-through;}
  .kit-mastery-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:6px 14px;
    max-height:420px; overflow-y:auto; padding:10px 4px; border:1px solid var(--line-soft); border-radius:6px;
  }
  .kit-mastery-item{display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0;}
  .kit-mastery-item.mastered label{color:var(--success);}
  .trainee-tab-row{display:flex; gap:8px; margin-bottom:14px; border-bottom:1px solid var(--line);}
  .trainee-tab-btn{
    background:none; border:none; border-bottom:2px solid transparent; padding:8px 4px; margin-bottom:-1px;
    color:var(--text-faint); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  }
  .trainee-tab-btn.active{color:var(--amber); border-bottom-color:var(--amber);}
  .media-tabs{display:flex; gap:2px; margin-bottom:10px;}
  .media-tab-btn{
    font-family:monospace; font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase;
    background:var(--bg); border:1px solid var(--line); color:var(--text-faint);
    padding:6px 12px; cursor:pointer; border-radius:3px;
  }
  .media-tab-btn.active{color:var(--amber); border-color:var(--amber-dim);}
  .media-pane{display:none;}
  .media-pane.active{display:block;}
  .photo-empty{
    border:1.5px dashed var(--line); border-radius:6px; padding:26px 16px; text-align:center;
    color:var(--text-faint); font-size:13px;
  }
  .photo-empty input[type=file]{margin-top:10px;}
  .photo-wrap{position:relative; display:inline-block; max-width:100%; border-radius:6px; overflow:hidden; border:1px solid var(--line);}
  .photo-wrap img{display:block; max-width:100%; height:auto;}
  .hotspot-pin{
    position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px;
    background:var(--amber); color:#1B1D21; border-radius:50%;
    font-family:monospace; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    border:2px solid #1B1D21; box-shadow:0 0 0 1px var(--amber);
  }
  .hotspot-pin:hover .hotspot-label{display:block;}
  .hotspot-label{
    display:none; position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    background:#1B1D21; color:#fff; font-size:12px; font-weight:500;
    padding:5px 9px; border-radius:3px; white-space:nowrap; border:1px solid var(--line); z-index:5;
  }
  .media-btn-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .media-btn{
    font-size:12px; font-weight:600; color:var(--text);
    background:var(--bg); border:1px solid var(--line); border-radius:3px;
    padding:6px 12px; cursor:pointer;
  }
  .media-btn:hover{border-color:var(--text-faint);}
  .media-btn.danger{color:#BF5B56;}
  .label-mode-active .photo-wrap{cursor:crosshair; outline:2px solid var(--amber);}
  .video-empty{
    border:1.5px dashed var(--line); border-radius:6px; padding:20px 16px; text-align:center; color:var(--text-faint); font-size:13px;
  }
  .video-input-row{display:flex; gap:8px; margin-top:10px;}
  .video-input-row input{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:3px; color:var(--text);
    font-size:13px; padding:8px 10px;
  }
  .video-frame-wrap{position:relative; width:100%; padding-top:56.25%; border-radius:6px; overflow:hidden; border:1px solid var(--line);}
  .video-frame-wrap iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
  .media-hint{font-size:11.5px; color:var(--text-faint); margin-top:6px;}
  .room-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; margin-top:16px;}
  .room-card{background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column;}
  .room-card img{width:100%; height:180px; object-fit:cover; display:block;}
  .room-card .room-photo-missing{width:100%; height:180px; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:12.5px;}
  .room-card .room-body{padding:12px 14px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .room-card .room-name{font-weight:700; font-size:14.5px;}
  .room-reserve-btn{align-self:flex-start; margin-top:auto;}
  .room-reserve-pending{font-size:12px; color:var(--text-faint); font-style:italic; margin-top:auto;}
  .kit-detail ul, .kit-detail ol{margin:0 0 4px; padding-left:20px;}
  .kit-detail li{margin-bottom:5px;}
  .kit-contents-list li{color:var(--text);}
  .kit-perreq-list li{color:var(--text-muted); font-style:italic;}
  .kit-detail h4{margin:14px 0 6px;}
  .kit-detail h4:first-child{margin-top:0;}
  .kit-detail .note-callout{
    background:rgba(232,163,61,0.08); border:1px solid var(--amber-dim); border-radius:6px;
    padding:10px 12px; margin:6px 0 10px; font-size:13px; color:#9C6B1F;
  }
  .kit-detail .review-note{
    background:rgba(199,203,209,0.08); border:1px solid var(--special); border-radius:6px;
    padding:10px 12px; margin:6px 0 10px; font-size:13px; color:var(--special);
  }
  .kit-detail .eligibility-note{
    background:rgba(178,59,59,0.07); border:1px solid rgba(178,59,59,0.35); border-radius:6px;
    padding:10px 12px; margin:6px 0 10px; font-size:13px; color:var(--danger);
  }
  .kit-detail .eligibility-note.approval{background:rgba(157,160,166,0.08); border-color:var(--special); color:var(--special);}
  .kit-detail .eligibility-note.linked{background:rgba(198,134,42,0.08); border-color:var(--amber-dim); color:var(--amber-dim);}
  .kit-detail .eligibility-note.ok{background:rgba(46,139,92,0.08); border-color:rgba(46,139,92,0.4); color:var(--success);}
  footer.page-footer{
    text-align:center; padding:24px 20px 40px; font-size:11.5px; color:var(--text-faint);
    font-family:monospace;
  }
</style>
</head>
<body>

<div class="header" style="display:flex; justify-content:space-between; align-items:center;">
  <h1>REGENT <span>EQUIPMENT OFFICE</span></h1>
  <div id="authArea" style="font-size:13px;"></div>
</div>

<div id="loginModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center;">
  <div class="card" style="max-width:340px; width:90%; background:#fff;">
    <strong style="display:block; margin-bottom:10px;">Staff Login</strong>
    <input type="email" id="loginEmail" placeholder="Staff email" style="width:100%; margin-bottom:8px; box-sizing:border-box;">
    <input type="password" id="loginPassword" placeholder="Password" style="width:100%; margin-bottom:10px; box-sizing:border-box;">
    <div id="loginError" style="color:var(--danger); font-size:12.5px; margin-bottom:8px;"></div>
    <div style="display:flex; gap:8px;">
      <button class="btn" id="loginSubmitBtn" type="button">Log In</button>
      <button class="btn secondary" id="loginCancelBtn" type="button">Cancel</button>
    </div>
  </div>
</div>

<div class="tab-nav">
  <button class="tab-btn active" data-page="orders" type="button">Checkout / Check-In</button>
  <button class="tab-btn" data-page="kits" type="button">Kit ID &amp; Testing</button>
  <button class="tab-btn" data-page="index" type="button">Equipment Index</button>
  <button class="tab-btn" data-page="sops" type="button">SOPs</button>
  <button class="tab-btn" data-page="policy" type="button">Policies</button>
  <button class="tab-btn" data-page="rooms" type="button">Room Reservations</button>
  <button class="tab-btn" data-page="documents" type="button">Documents</button>
  <button class="tab-btn" data-page="updatelog" type="button">Update Log</button>
</div>

<div id="page-orders" class="page"></div>
<div id="page-kits" class="page" style="display:none;"></div>
<div id="page-index" class="page" style="display:none;"></div>
<div id="page-updatelog" class="page" style="display:none;"></div>
<div id="page-sops" class="page" style="display:none;"></div>
<div id="page-policy" class="page" style="display:none;"></div>
<div id="page-rooms" class="page" style="display:none;"></div>
<div id="page-documents" class="page" style="display:none;"></div>

<footer class="page-footer">
  Equipment Office · (757) 352-4240 · equipment@regent.edu — This tool is a quick-reference supplement to Cheqroom. The Student Handbook and Policy Manual govern in case of any discrepancy.
</footer>

<script type="module">
import {
  getAllKits, getKit, getOrder, saveOrder, listOrders, setOrderArchived,
  addConditionLogEntry, getConditionLogForKit, resolveConditionLogEntry,
  addUpdateLogItem, getUpdateLogItems, toggleUpdateLogItem, deleteUpdateLogItem,
  setLastReviewedDate, getLastReviewedDate, watchCollection,
  getMediaIndex, setKitMediaStatus,
  signInStaff, signOutStaff, onAuthStateChange, getCurrentUser,
  exportFullBackup, restoreFromBackup,
  addTrainee, getAllTrainees, getTrainee, setTraineeMilestone, setTraineeKitMastery, mergeDuplicateTrainees,
  getKitPhotos, addKitPhoto, removeKitPhotoAt, setPhotoCaption, setPhotoHotspots,
  saveKitVideoLink, removeKitVideo,
} from "./firebase-data.js";
import { SOP_SECTIONS } from "./sops_data.js";
import { POLICY_SECTIONS, POLICY_TOPICS } from "./policies_data.js";
import { EMBEDDED_DOCS } from "./documents_data.js";
import { ITEMS, TIER_LABELS, CATEGORIES } from "./items_data.js";
import { ROOMS, ROOM_RESERVATION_RULES } from "./rooms_data.js";

const STUDENT_TIER_LABELS = {freshman:"Freshman", sophomore:"Sophomore", junior:"Junior", senior:"Senior+"};
const STUDENT_TIER_RANK = {freshman:1, sophomore:2, junior:3, senior:4};

let ALL_KITS = [];
let studentGrade = null;
let kitSearchTerm = '';
let kitActiveCategories = new Set();
let openKitId = null;

// ---------------- Tab switching ----------------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['orders','kits','index','updatelog','sops','policy','documents','rooms'].forEach(p=>{
      document.getElementById('page-'+p).style.display = (p===btn.dataset.page) ? '' : 'none';
    });
    if(btn.dataset.page === 'rooms') renderRoomsPage();
    if(btn.dataset.page === 'updatelog') renderUpdateLog();
    if(btn.dataset.page === 'sops'){ renderSOPs(); loadTraineeList(); }
    if(btn.dataset.page === 'policy') renderPolicies();
    if(btn.dataset.page === 'documents') renderDocumentsList();
  });
});

// ---------------- Eligibility (ported exactly from the original tool) ----------------
function eligibility(kit, gradeOverride){
  const grade = gradeOverride !== undefined ? gradeOverride : studentGrade;
  if(kit.gradeApproval) return {status:'approval', label:'Requires special clearance'};
  if(kit.gradeLinked) return {status:'linked', label:'Depends on paired camera'};
  if(!kit.gradeTier) return {status:'none', label:null};
  if(!grade) return {status:'none', label:`Requires ${STUDENT_TIER_LABELS[kit.gradeTier]}+`};
  const need = STUDENT_TIER_RANK[kit.gradeTier];
  const have = STUDENT_TIER_RANK[grade];
  if(have >= need) return {status:'ok', label:`Cleared — ${STUDENT_TIER_LABELS[kit.gradeTier]}+ kit`};
  return {status:'blocked', label:`Not allowed — requires ${STUDENT_TIER_LABELS[kit.gradeTier]}+`};
}

// ---------------- Kit ID & Testing page ----------------
let kitMediaIndex = {};

function mediaStatusBadge(kitId){
  const media = kitMediaIndex[kitId] || {photo:false, video:false};
  if(!media.photo && !media.video) return `<span class="badge" style="background:rgba(198,134,42,0.14); color:var(--amber-dim);">🎥 Needs photo &amp; video</span>`;
  if(!media.photo) return `<span class="badge" style="background:rgba(198,134,42,0.14); color:var(--amber-dim);">📷 Needs photo</span>`;
  if(!media.video) return `<span class="badge" style="background:rgba(198,134,42,0.14); color:var(--amber-dim);">🎬 Needs video</span>`;
  return `<span class="badge ok">✓ Documented</span>`;
}

function renderKitsPage(){
  const el = document.getElementById('page-kits');
  const kitCategories = [...new Set(ALL_KITS.map(k=>k.category))];
  el.innerHTML = `
    <div class="callout">Kit reference, testing steps, condition log, and photo/video documentation status — live-synced across every device automatically.</div>
    <input type="text" id="kitSearch" placeholder="Search kits…" style="width:100%; margin-bottom:12px;" value="${kitSearchTerm}">
    <div id="categoryChips" style="margin-bottom:10px;">
      ${kitCategories.map(cat =>
        `<span class="grade-chip ${kitActiveCategories.has(cat)?'active':''}" data-cat="${cat}">${cat}</span>`
      ).join('')}
    </div>
    <div id="gradeChips" style="margin-bottom:14px;">
      ${Object.entries(STUDENT_TIER_LABELS).map(([tier,label])=>
        `<span class="grade-chip ${studentGrade===tier?'active':''}" data-tier="${tier}">${label}</span>`).join('')}
      <span class="grade-chip" data-tier="">Clear</span>
    </div>
    <div id="kitsList"></div>
  `;
  document.getElementById('kitSearch').addEventListener('input', e=>{ kitSearchTerm = e.target.value.toLowerCase(); drawKitsList(); });
  el.querySelectorAll('[data-cat]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const c = chip.dataset.cat;
      if(kitActiveCategories.has(c)) kitActiveCategories.delete(c); else kitActiveCategories.add(c);
      renderKitsPage();
    });
  });
  el.querySelectorAll('[data-tier]').forEach(chip=>{
    chip.addEventListener('click', ()=>{ studentGrade = chip.dataset.tier || null; renderKitsPage(); });
  });
  drawKitsList();
}

function kitCardHTML(k){
  const elig = eligibility(k);
  const expanded = String(openKitId) === String(k.id);

  let eligNote = '';
  if(elig.status === 'blocked'){
    eligNote = `<div class="eligibility-note">🔒 <strong>Not allowed for this student:</strong> ${k.gradeText || ''}</div>`;
  } else if(elig.status === 'approval'){
    eligNote = `<div class="eligibility-note approval">⚠ <strong>Special clearance required:</strong> ${k.gradeText || ''}</div>`;
  } else if(elig.status === 'linked'){
    eligNote = `<div class="eligibility-note linked">↳ <strong>No independent grade gate:</strong> ${k.gradeText || ''}</div>`;
  } else if(k.gradeTier && k.gradeText){
    eligNote = `<div class="eligibility-note ok">✓ <strong>Grade policy:</strong> ${k.gradeText}</div>`;
  }

  return `
    <div class="kit-card" data-kit-id="${k.id}">
      <div data-expand-kit="${k.id}" style="cursor:pointer;">
        <span class="kit-name">${k.name}</span>
        ${k.kittype==='retired' ? '<span class="badge blocked">RETIRED</span>' : ''}
        ${k.review ? '<span class="review-badge">REVIEW</span>' : ''}
        ${elig.label ? `<span class="badge ${elig.status}">${elig.label}</span>` : ''}
        <span id="mediabadge-${k.id}">${mediaStatusBadge(k.id)}</span>
        <span style="font-size:11px; color:var(--text-faint); margin-left:6px;">${(k.contents||[]).length} items ${expanded ? '▲' : '▼'}</span>
      </div>
      ${expanded ? `
      <div class="kit-detail" style="margin-top:10px;">
        <h4>Standard Contents</h4>
        <ol class="kit-contents-list">${(k.contents||[]).map(c=>`<li>${c}</li>`).join('')}</ol>
        ${k.perreq && k.perreq.length ? `<h4>Per Request / Limited Availability</h4><ol class="kit-perreq-list">${k.perreq.map(c=>`<li>${c}</li>`).join('')}</ol>` : ''}
        ${k.notes ? `<div class="note-callout">📝 ${k.notes}</div>` : ''}
        ${eligNote}
        ${k.review ? `<div class="review-note">⚠ <strong>Flagged for Ivy's review:</strong> ${k.review}</div>` : ''}
        ${k.test && k.test.length ? `<h4>Testing / Setup Procedure</h4><ol>${k.test.map(c=>`<li>${c}</li>`).join('')}</ol>` : ''}
      </div>
      ` : ''}
      <div class="kit-condition-area" id="cond-${k.id}" style="margin-top:8px; font-size:12.5px;"></div>

function drawKitsList(){
  const kitCategories = [...new Set(ALL_KITS.map(k=>k.category))];
  const filtered = ALL_KITS.filter(k => {
    if(kitActiveCategories.size && !kitActiveCategories.has(k.category)) return false;
    return !kitSearchTerm || k.name.toLowerCase().includes(kitSearchTerm);
  });
  const listEl = document.getElementById('kitsList');
  if(!filtered.length){ listEl.innerHTML = '<div class="empty-state">No kits match.</div>'; return; }

  let html = '';
  kitCategories.forEach(cat=>{
    const items = filtered.filter(k => k.category === cat).sort((a,b)=>a.name.localeCompare(b.name));
    if(!items.length) return;
    html += `<div style="margin-bottom:22px;"><h3 style="font-size:15px; color:var(--text-muted); border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:10px;">${cat || 'Uncategorized'} <span style="font-size:12px; color:var(--text-faint);">(${items.length})</span></h3>${items.map(kitCardHTML).join('')}</div>`;
  });
  listEl.innerHTML = html;

  filtered.forEach(k => loadConditionLogForCard(k.id));
  listEl.querySelectorAll('[data-expand-kit]').forEach(head=>{
    head.addEventListener('click', ()=>{
      const id = head.dataset.expandKit;
      openKitId = (String(openKitId) === String(id)) ? null : id;
      drawKitsList();
    });
  });
  listEl.querySelectorAll('[data-report-kit]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!requireStaffAuth('report a condition issue')) return;
      const item = prompt('Which item is this about?');
      if(!item) return;
      const unitId = prompt('Unit/Asset # (Cheqroom, leave blank if unknown):') || '';
      const note = prompt('Brief note (optional):') || '';
      const reporter = prompt('Your name:') || 'Staff';
      await addConditionLogEntry({ kitId: String(btn.dataset.reportKit), item, unitId, note, reportedBy: reporter, type: 'damaged' });
      loadConditionLogForCard(btn.dataset.reportKit);
    });
  });
  listEl.querySelectorAll('[data-toggle-media]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kitId = btn.dataset.toggleMedia;
      const section = document.getElementById(`media-${kitId}`);
      const nowOpen = section.style.display === 'none';
      section.style.display = nowOpen ? '' : 'none';
      if(nowOpen && !section.dataset.loaded){
        section.dataset.loaded = 'true';
        const k = ALL_KITS.find(x=>String(x.id)===String(kitId));
        initKitMedia(k);
      }
    });
  });
}

async function initKitMedia(kit){

let labelModeKey = null; // "kitId-photoIndex" of whichever photo is currently in label mode, if any

function renderPhotoPane(kit, pane, photos){
  const addBlockHTML = photos.length < 6 ? `
    <div class="photo-empty" style="margin-top:${photos.length ? '14px' : '0'};">
      ${photos.length ? 'Add another photo' : 'No reference photos yet'} (${photos.length}/6)<br>
      <input type="file" accept="image/*" id="photo-input-${kit.id}">
    </div>
  ` : `<div class="media-hint">Maximum of 6 photos reached — remove one to add another.</div>`;

  pane.innerHTML = `
    ${photos.map((p, idx) => {
      const key = `${kit.id}-${idx}`;
      const inLabelMode = labelModeKey === key;
      return `
      <div style="margin-bottom:18px; padding-bottom:14px; ${idx < photos.length-1 || photos.length ? 'border-bottom:1px solid var(--line-soft);' : ''}">
        <input type="text" class="photo-caption-input" data-photo-idx="${idx}" placeholder="Caption (e.g. Bag #1)" value="${p.caption || ''}" style="width:100%; margin-bottom:8px; font-size:13px;">
        <div class="photo-wrap" data-photo-idx="${idx}">
          <img src="${p.url}" alt="${kit.name}">
          ${(p.hotspots||[]).map((h,i)=>`<div class="hotspot-pin" style="left:${h.x}%; top:${h.y}%;" data-pin-idx="${i}">${i+1}<span class="hotspot-label">${h.label}</span></div>`).join('')}
        </div>
        <div class="media-btn-row">
          <button class="media-btn" data-action="label" data-photo-idx="${idx}" type="button">${inLabelMode ? '✅ Done Labeling' : '🏷️ Label Items'}</button>
          <button class="media-btn danger" data-action="removephoto" data-photo-idx="${idx}" type="button">🗑️ Remove This Photo</button>
        </div>
        <div class="media-hint">${inLabelMode ? 'Click anywhere on the photo to drop a label pin.' : 'Click "Label Items," then click each part in the photo to tag it.'}</div>
      </div>
    `;}).join('')}
    ${addBlockHTML}
  `;

  const addInput = pane.querySelector(`#photo-input-${kit.id}`);
  if(addInput){
    addInput.addEventListener('change', (e)=>{
      if(!requireStaffAuth('add a reference photo')) return;
      const caption = photos.length ? (prompt('Caption for this photo (optional — e.g. "Bag #2"):') || '') : '';
      handlePhotoUpload(kit, e.target.files[0], caption);
    });
  }

  pane.querySelectorAll('.photo-caption-input').forEach(input=>{
    input.addEventListener('change', async (e)=>{
      if(!requireStaffAuth('caption a photo')) return;
      const idx = parseInt(e.target.dataset.photoIdx);
      try{ await setPhotoCaption(kit.id, idx, e.target.value); }
      catch(err){ alert('⚠ Could not save caption — ' + err.message); }
    });
  });

  pane.querySelectorAll('[data-action="label"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!requireStaffAuth('label items in a photo')) return;
      const idx = parseInt(btn.dataset.photoIdx);
      const key = `${kit.id}-${idx}`;
      labelModeKey = (labelModeKey === key) ? null : key;
      renderPhotoPane(kit, pane, photos);
    });
  });

  pane.querySelectorAll('[data-action="removephoto"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!requireStaffAuth('remove a photo')) return;
      if(!confirm('Remove this photo and its labels?')) return;
      const idx = parseInt(btn.dataset.photoIdx);
      try{
        await removeKitPhotoAt(kit.id, idx);
        labelModeKey = null;
        loadPhotoPane(kit);
        const remaining = await getKitPhotos(kit.id);
        await setKitMediaStatus(kit.id, 'photo', remaining.length > 0);
        if(!kitMediaIndex[kit.id]) kitMediaIndex[kit.id] = {photo:false, video:false};
        kitMediaIndex[kit.id].photo = remaining.length > 0;
        refreshMediaBadgeOnly(kit.id);
      }catch(e){
        alert('⚠ Could not remove — ' + e.message);
      }
    });
  });

  pane.querySelectorAll('.photo-wrap').forEach(wrap=>{
    const idx = parseInt(wrap.dataset.photoIdx);
    const key = `${kit.id}-${idx}`;
    wrap.classList.toggle('label-mode-active', labelModeKey === key);

    wrap.querySelectorAll('.hotspot-pin').forEach(pin=>{
      pin.addEventListener('click', async (evt)=>{
        evt.stopPropagation();
        if(!requireStaffAuth('remove a label')) return;
        const pinIdx = parseInt(pin.dataset.pinIdx);
        const hotspots = photos[idx].hotspots || [];
        if(confirm(`Remove label "${hotspots[pinIdx].label}"?`)){
          const removed = hotspots[pinIdx];
          hotspots.splice(pinIdx,1);
          try{
            await setPhotoHotspots(kit.id, idx, hotspots);
          }catch(e){
            hotspots.splice(pinIdx,0,removed);
            alert('⚠ Could not save — the label was not removed.');
            return;
          }
          loadPhotoPane(kit);
        }
      });
    });

    wrap.querySelector('img').addEventListener('click', async (evt)=>{
      if(labelModeKey !== key) return;
      if(!requireStaffAuth('label items in a photo')) return;
      const rect = wrap.getBoundingClientRect();
      const x = ((evt.clientX - rect.left) / rect.width) * 100;
      const y = ((evt.clientY - rect.top) / rect.height) * 100;
      const hotspots = photos[idx].hotspots || [];
      const suggestion = (kit.contents || [])[hotspots.length] || '';
      const label = prompt('Label for this item:', suggestion);
      if(!label) return;
      hotspots.push({x: x.toFixed(1), y: y.toFixed(1), label});
      try{ await setPhotoHotspots(kit.id, idx, hotspots); }catch(e){
        alert('Could not save label.');
      }
      loadPhotoPane(kit);
    });
  });
}

function handlePhotoUpload(kit, file, caption){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = async ()=>{
      const maxW = 650;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
      try{
        await addKitPhoto(kit.id, dataUrl, caption);
        await setKitMediaStatus(kit.id, 'photo', true);
        if(!kitMediaIndex[kit.id]) kitMediaIndex[kit.id] = {photo:false, video:false};
        kitMediaIndex[kit.id].photo = true;
      }catch(err){
        alert('⚠ ' + err.message);
        return;
      }
      loadPhotoPane(kit);
      refreshMediaBadgeOnly(kit.id);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

let indexActiveGrades = new Set();
let indexActiveCategories = new Set();
let indexSearchTerm = '';
let indexExpandedId = null;

function indexItemMatches(item){
  if(indexActiveGrades.size && !indexActiveGrades.has(item.tier)) return false;
  if(indexActiveCategories.size && !indexActiveCategories.has(item.category)) return false;
  if(indexSearchTerm){
    const hay = [item.name, item.batteries, item.media, item.tripod, item.grade, (item.lenses||[]).join(' ')].join(' ').toLowerCase();
    if(!hay.includes(indexSearchTerm)) return false;
  }
  return true;
}

function indexDetailRow(label, value, emptyText){
  const v = value && value.trim() ? value : null;
  return `<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-value ${v?'':'empty'}">${v ? v : (emptyText||'None specified')}</span></div>`;
}

function indexCardHTML(item){
  const expanded = indexExpandedId === item.id;
  const lensStr = (item.lenses && item.lenses.length) ? item.lenses.join(' · ') : '';
  return `<div class="kit-card" data-item-id="${item.id}" style="cursor:pointer;">

          <option value="senior" ${newOrderStudentGrade==='senior'?'selected':''}>Senior+</option>
        </select>
        <input type="text" id="resNumInput" placeholder="Reservation #" value="${newOrderResNum}">
        <input type="text" id="studentNameInput" placeholder="Student name" value="${newOrderStudentName}">
      </div>
      ${mismatches.length ? `
        <div class="callout" style="border-left-color:var(--danger);">
          <strong style="color:var(--danger);">⚠ Grade eligibility conflict</strong> — declared <strong>${newOrderStudentGrade}</strong>, but this order includes:
          <ul style="margin:6px 0 10px 18px;">${mismatches.map(m=>`<li><strong>${m.kit.name}</strong> — ${m.elig.label}</li>`).join('')}</ul>
          <label style="display:flex; align-items:flex-start; gap:8px; font-size:13px; margin-bottom:8px;">
            <input type="checkbox" id="gradeOverrideCheck" ${newOrderOverride.ack?'checked':''} style="margin-top:3px;">
            <span>Staff is overriding this on purpose (e.g. professor-approved exception) — required before saving.</span>
          </label>
          <input type="text" id="gradeOverrideReason" placeholder="Reason for override" value="${newOrderOverride.reason||''}" style="width:100%; box-sizing:border-box;">
        </div>
      ` : ''}
      <div id="selectedKitsArea">${newOrderKits.map(id=>{
        const k = ALL_KITS.find(x=>String(x.id)===String(id));
        const unitVal = newOrderUnitIds[id] || '';
        return k ? `<span class="selected-kit-chip">${k.name}
          <input type="text" class="order-unit-input" data-unitkit="${id}" placeholder="Unit/Asset # (Cheqroom)" value="${unitVal}" style="width:150px; margin-left:8px; font-size:12px;">
          <button data-remove="${id}" type="button">✕</button></span>` : '';
      }).join('')}</div>
      <input type="text" id="kitPickerSearch" placeholder="Search kits to add…" style="width:100%; margin-bottom:10px;">
      <div id="kitPickerList" style="max-height:200px; overflow-y:auto; border:1px solid var(--line-soft); border-radius:6px; margin-bottom:10px;"></div>
      <button class="btn secondary" id="buildChecklistBtn" type="button" style="margin-top:8px;" ${!newOrderKits.length ? 'disabled' : ''}>Build Combined Checklist ↓</button>
    </div>
    <div id="checklistArea"></div>
  `;
  document.getElementById('studentGradeSelect').addEventListener('change', e=>{ newOrderStudentGrade = e.target.value; renderNewOrderPane(); });
  document.getElementById('resNumInput').addEventListener('input', e=>{ newOrderResNum = e.target.value; });
  document.getElementById('studentNameInput').addEventListener('input', e=>{ newOrderStudentName = e.target.value; });
  const overrideCheckEl = document.getElementById('gradeOverrideCheck');
  if(overrideCheckEl) overrideCheckEl.addEventListener('change', e=>{ newOrderOverride.ack = e.target.checked; });
  const overrideReasonEl = document.getElementById('gradeOverrideReason');
  if(overrideReasonEl) overrideReasonEl.addEventListener('input', e=>{ newOrderOverride.reason = e.target.value; });
  const pickerList = document.getElementById('kitPickerList');
  function drawPicker(term){
    const filtered = ALL_KITS.filter(k => !term || k.name.toLowerCase().includes(term)).sort((a,b)=>a.name.localeCompare(b.name));
    pickerList.innerHTML = filtered.map(k => `<div data-add="${k.id}" style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--line-soft);">${k.name}</div>`).join('');
    pickerList.querySelectorAll('[data-add]').forEach(row=>{
      row.addEventListener('click', ()=>{
        if(!newOrderKits.includes(row.dataset.add)) newOrderKits.push(row.dataset.add);
        renderNewOrderPane();
      });
    });
  }
  document.getElementById('kitPickerSearch').addEventListener('input', e => drawPicker(e.target.value.toLowerCase()));
  drawPicker('');
  content.querySelectorAll('[data-unitkit]').forEach(inp=>{
    inp.addEventListener('input', e=>{ newOrderUnitIds[e.target.dataset.unitkit] = e.target.value; });
  });
  content.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ newOrderKits = newOrderKits.filter(id=>id!==btn.dataset.remove); renderNewOrderPane(); });
  });
  document.getElementById('buildChecklistBtn').addEventListener('click', ()=>{
    newOrderChecklist = {};
    newOrderKits.forEach(id=>{
      const k = ALL_KITS.find(x=>String(x.id)===String(id));
      const standard = (k.contents || []).map(()=>({checked:false, note:'', optional:false}));
      const perreq = (k.perreq || []).map(()=>({checked:false, note:'', optional:true}));
      newOrderChecklist[id] = [...standard, ...perreq];
    });
    renderChecklistArea();
  });
}

function renderChecklistArea(){
  const area = document.getElementById('checklistArea');
  if(!newOrderKits.length){ area.innerHTML = ''; return; }
  let html = `<div class="card" style="margin-top:12px;"><h4 style="font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; margin:0 0 14px;">Combined Checkout Checklist</h4>`;
  newOrderKits.forEach(id=>{
    const k = ALL_KITS.find(x=>String(x.id)===String(id));
    const combinedItems = [...(k.contents || []), ...(k.perreq || [])];
    html += `<div style="margin-bottom:14px;"><div style="font-weight:700; margin-bottom:6px;">${k.name}</div>`;
    combinedItems.forEach((item,i)=>{
      const state = newOrderChecklist[id][i];
      html += `<div class="checklist-row" data-kit="${id}" data-idx="${i}">
        <input type="checkbox" ${state.checked?'checked':''} class="item-check">
        <span>${item}</span>
        ${state.optional ? '<span class="badge approval" style="margin-left:6px;">Optional / Per Request</span>' : ''}
        <input type="text" class="item-note" placeholder="note (optional)" value="${state.note}" style="margin-left:auto; font-size:12px;">
      </div>`;
    });
    html += `</div>`;
  });
  html += `
    <div class="order-field-row" style="margin-top:14px;">
      <div style="flex:1;"><label style="font-size:12px; color:var(--text-faint);">Student Signature (typed name)</label><input type="text" id="studentSigInput" placeholder="Type full name to acknowledge" style="width:100%;" value="${newOrderStudentSig}"></div>
      <div style="flex:1;"><label style="font-size:12px; color:var(--text-faint);">Staff Signature (typed name)</label><input type="text" id="staffSigInput" placeholder="Type full name" style="width:100%;" value="${newOrderStaffSig}"></div>
    </div>
    <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn" id="saveOrderBtn" type="button">💾 Save Checkout Record</button>
      <button class="btn secondary" id="saveDraftBtn" type="button">📋 Save Draft</button>
      <button class="btn secondary" id="printOrderBtn" type="button">🖨️ Print Summary</button>
    </div>
    <div style="font-size:12.5px; color:var(--text-faint); margin-top:8px;">Draft: no signature needed yet — save it, give the student the reservation number, they can look it up later to finish checking items off and sign themselves.</div>
    <div id="saveStatusMsg" style="margin-top:8px; font-size:13px;"></div>
  </div>`;
  area.innerHTML = html;

  area.querySelectorAll('.item-check').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const row = e.target.closest('[data-kit]');
      newOrderChecklist[row.dataset.kit][parseInt(row.dataset.idx)].checked = e.target.checked;
      renderChecklistArea();
    });
  });
  area.querySelectorAll('.item-note').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const row = e.target.closest('[data-kit]');
      newOrderChecklist[row.dataset.kit][parseInt(row.dataset.idx)].note = e.target.value;
    });
  });
  document.getElementById('studentSigInput').addEventListener('input', e=>{ newOrderStudentSig = e.target.value; });
  document.getElementById('staffSigInput').addEventListener('input', e=>{ newOrderStaffSig = e.target.value; });
  document.getElementById('saveOrderBtn').addEventListener('click', saveNewOrder);
  document.getElementById('saveDraftBtn').addEventListener('click', saveDraftOrder);
  document.getElementById('printOrderBtn').addEventListener('click', ()=>printOrderSummary(buildOrderObjectDraft()));
}

function buildOrderObjectDraft(){
  const mismatches = getGradeMismatches();
  const kitsData = newOrderKits.map(id=>{
    const k = ALL_KITS.find(x=>String(x.id)===String(id));
    const combinedItems = [...(k.contents || []), ...(k.perreq || [])];
    return {
      kitId:id, name:k.name, unitId: newOrderUnitIds[id] || '',
      items: combinedItems.map((item,i)=>({item, ...(newOrderChecklist[id] ? newOrderChecklist[id][i] : {checked:false,note:'',optional:false})}))
    };
  });
  return {
    reservationNumber: newOrderResNum.trim() || '(no reservation #)',
    studentName: newOrderStudentName.trim() || '(no name entered)',
    kits: kitsData,
    studentGradeLevel: newOrderStudentGrade,
    gradeOverride: mismatches.length ? {...newOrderOverride} : null,
    checkoutSignatureStudent: newOrderStudentSig.trim(),
    checkoutSignatureStaff: newOrderStaffSig.trim(),
    checkoutTimestamp: new Date().toISOString(), status: 'checked_out', archived: false,
  };
}

function getGradeMismatches(){
  if(!newOrderStudentGrade) return [];
  return newOrderKits.map(id => ALL_KITS.find(k=>String(k.id)===String(id))).filter(k=>k)
    .map(k => eligibility(k, newOrderStudentGrade)).filter(e => e.status === 'blocked');
}

async function saveNewOrder(){
  const statusEl = document.getElementById('saveStatusMsg');
  if(!requireStaffAuth('save a checkout record')) return;
  const mismatches = getGradeMismatches();
  if(mismatches.length && !newOrderOverride.ack){
    statusEl.textContent = '⚠ This order has a grade-eligibility conflict that hasn\'t been acknowledged. Check the override box above, or remove the flagged kit(s), before saving.';
    statusEl.style.color = 'var(--danger)'; return;
  }
  if(mismatches.length && newOrderOverride.ack && !newOrderOverride.reason.trim()){
    statusEl.textContent = '⚠ An override reason is required when overriding a grade-eligibility conflict.';
    statusEl.style.color = 'var(--danger)'; return;
  }
  const order = buildOrderObjectDraft();
  if(order.reservationNumber === '(no reservation #)'){
    statusEl.textContent = '⚠ Please enter a reservation number before saving.'; statusEl.style.color = 'var(--danger)'; return;
  }
  if(!order.checkoutSignatureStudent){
    statusEl.textContent = '⚠ Student signature (typed name) is required before saving.'; statusEl.style.color = 'var(--danger)'; return;
  }
  try{
    await saveOrder(order);
    statusEl.textContent = `✅ Saved. Staff can look this up at check-in using reservation #${order.reservationNumber}.`;
    statusEl.style.color = 'var(--success)';
  }catch(err){
    statusEl.textContent = '⚠ Could not save — ' + err.message + '. Try printing as a backup.';
    statusEl.style.color = 'var(--danger)';
  }
}

async function saveDraftOrder(){
  const statusEl = document.getElementById('saveStatusMsg');
  if(!requireStaffAuth('save a draft order')) return;
  const mismatches = getGradeMismatches();
  if(mismatches.length && !newOrderOverride.ack){
    statusEl.textContent = '⚠ This order has a grade-eligibility conflict that hasn\'t been acknowledged — even as a draft, since the student won\'t see this warning when finishing it themselves.';
    statusEl.style.color = 'var(--danger)'; return;
  }
  if(mismatches.length && newOrderOverride.ack && !newOrderOverride.reason.trim()){
    statusEl.textContent = '⚠ An override reason is required when overriding a grade-eligibility conflict.';
    statusEl.style.color = 'var(--danger)'; return;
  }
  const order = buildOrderObjectDraft();
  if(order.reservationNumber === '(no reservation #)'){
    statusEl.textContent = '⚠ Please enter a reservation number before saving.'; statusEl.style.color = 'var(--danger)'; return;
  }
  order.status = 'draft';
  try{
    await saveOrder(order);
    statusEl.textContent = `✅ Draft saved. Give the student reservation #${order.reservationNumber} — they can look it up later to finish checking items off and sign.`;
    statusEl.style.color = 'var(--success)';
  }catch(err){
    statusEl.textContent = '⚠ Could not save — ' + err.message;
    statusEl.style.color = 'var(--danger)';
  }
}

function printOrderSummary(order){

    <h3 style="margin:18px 0 6px; font-size:15px;">${k.name}${k.unitId ? ` (Unit ${k.unitId})` : ''}</h3>
    <table style="width:100%; border-collapse:collapse; font-size:13px;">
      ${k.items.map(it=>`<tr style="border-bottom:1px solid #ddd;">
        <td style="padding:4px 0; width:24px;">${it.checked?'☑':'☐'}</td>
        <td style="padding:4px 0;">${it.item}${it.optional ? ' <em>(Optional / Per Request)</em>' : ''}</td>
        <td style="padding:4px 0; color:#a00;">${it.note||''}</td>
      </tr>`).join('')}
    </table>`).join('');
  win.document.write(`
    <html><head><title>Order ${order.reservationNumber}</title>
    <style>body{font-family:Arial,sans-serif; color:#111; padding:30px; max-width:800px; margin:0 auto;}
    h1{font-size:20px; border-bottom:2px solid #111; padding-bottom:8px;}
    .meta{font-size:13px; color:#444; margin-bottom:14px;}
    .sigs{margin-top:30px; display:flex; gap:40px;}
    .sig-line{border-top:1px solid #111; margin-top:40px; padding-top:4px; width:250px; font-size:12px;}
    </style></head><body>
    <h1>Regent Equipment Office — Checkout Summary</h1>
    <div class="meta">Reservation #: <strong>${order.reservationNumber}</strong> &nbsp;|&nbsp; Student: <strong>${order.studentName}</strong> &nbsp;|&nbsp; ${new Date(order.checkoutTimestamp).toLocaleString()}</div>
    ${kitsHtml}
    <div class="sigs">
      <div><div>${order.checkoutSignatureStudent}</div><div class="sig-line">Student Signature</div></div>
      <div><div>${order.checkoutSignatureStaff}</div><div class="sig-line">Checked Out By (Staff)</div></div>
    </div>
    </body></html>`);

async function renderLookupPane(){
  const content = document.getElementById('orderContent');
  if(lookupOpenOrder){ renderOrderDetail(lookupOpenOrder); return; }
  content.innerHTML = `
    <input type="text" id="lookupSearch" placeholder="Reservation # or student name…" style="width:100%; margin-bottom:8px;" value="${lookupSearchTerm}">
    <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-faint); margin-bottom:12px;">
      <input type="checkbox" id="showArchivedCheck" ${lookupShowArchived ? 'checked' : ''}>
      Include archived (completed) orders
    </label>
    <div id="lookupResults"></div>
  `;
  document.getElementById('lookupSearch').addEventListener('input', e=>{ lookupSearchTerm = e.target.value; drawResults(); });
  document.getElementById('showArchivedCheck').addEventListener('change', e=>{ lookupShowArchived = e.target.checked; drawResults(); });
  async function drawResults(){
    const resultsEl = document.getElementById('lookupResults');
    if(lookupSearchTerm.length < 3){ resultsEl.innerHTML = '<div class="empty-state">Type at least 3 characters to search.</div>'; return; }
    const orders = await listOrders(lookupSearchTerm, lookupShowArchived);
    resultsEl.innerHTML = orders.length ? orders.map(o => `
      <div class="kit-card" data-open="${o.reservationNumber}" style="cursor:pointer;">
        <strong>${o.reservationNumber}</strong> — ${o.studentName}
        <span class="status-badge">${(o.status||'').replace('_',' ')}</span>
        ${o.archived ? '<span class="status-badge" style="background:#6E6C61; color:#fff;">ARCHIVED</span>' : ''}
      </div>
    `).join('') : `<div class="empty-state">No matches${lookupShowArchived ? '' : ' (archived orders are hidden — check the box above to include them)'}.</div>`;

      row.addEventListener('click', ()=>{ lookupOpenOrder = row.dataset.open; renderOrdersPage(); });

// Deliberately left open, no staff login required — this is the self-service
// flow: staff already built the draft, a student finds it later, checks
// items off, and signs. Matches the Firestore rule that allows anonymous
// updates specifically while an order's status is still 'draft'.
function renderDraftFinishUI(content, order){
  let studentSig = order.checkoutSignatureStudent || '';
  let staffSig = order.checkoutSignatureStaff || '';

  function draw(){
    content.innerHTML = `
      <button class="btn secondary" id="backBtn" type="button">← Back</button>
      <div class="card" style="margin-top:12px;">
        <strong>${order.reservationNumber}</strong> — ${order.studentName}
        <span class="status-badge">draft</span>
        <div style="font-size:12.5px; color:var(--text-muted); margin:8px 0;">This order was started by staff and saved as a draft. Check each item off as you confirm it, then sign below to finish checkout.</div>
        ${order.kits.map((k,ki) => `
          <div style="margin-bottom:14px;"><div style="font-weight:700; margin-bottom:6px;">${k.name}${k.unitId ? ` [Unit ${k.unitId}]` : ''}</div>
            ${k.items.map((it,ii) => `
              <div class="checklist-row" data-ki="${ki}" data-ii="${ii}">
                <input type="checkbox" ${it.checked?'checked':''} class="draft-item-check">
                <span>${it.item}</span>
                ${it.optional ? '<span class="badge approval" style="margin-left:6px;">Optional / Per Request</span>' : ''}
                <input type="text" class="draft-item-note" placeholder="note (optional)" value="${it.note||''}" style="margin-left:auto; font-size:12px;">
              </div>
            `).join('')}
          </div>
        `).join('')}
        <div class="order-field-row" style="margin-top:14px;">
          <div style="flex:1;"><label style="font-size:12px; color:var(--text-faint);">Student Signature (typed name)</label><input type="text" id="draftStudentSig" value="${studentSig}" style="width:100%;" placeholder="Type full name to acknowledge"></div>
          <div style="flex:1;"><label style="font-size:12px; color:var(--text-faint);">Staff Signature (typed name)</label><input type="text" id="draftStaffSig" value="${staffSig}" style="width:100%;" placeholder="Type full name"></div>
        </div>
        <button class="btn" id="finishDraftBtn" type="button" style="margin-top:12px;">✅ Complete Checkout</button>
        <div id="draftStatusMsg" style="margin-top:8px; font-size:13px;"></div>
      </div>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=>{ lookupOpenOrder = null; renderOrdersPage(); });
    content.querySelectorAll('.draft-item-check').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const row = e.target.closest('[data-ki]');
        order.kits[row.dataset.ki].items[row.dataset.ii].checked = e.target.checked;
      });
    });
    content.querySelectorAll('.draft-item-note').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const row = e.target.closest('[data-ki]');
        order.kits[row.dataset.ki].items[row.dataset.ii].note = e.target.value;
      });
    });
    document.getElementById('draftStudentSig').addEventListener('input', e=>{ studentSig = e.target.value; });
    document.getElementById('draftStaffSig').addEventListener('input', e=>{ staffSig = e.target.value; });
    document.getElementById('finishDraftBtn').addEventListener('click', async ()=>{
      const statusEl = document.getElementById('draftStatusMsg');
      if(!studentSig.trim()){
        statusEl.textContent = '⚠ Student signature is required before finishing checkout.';
        statusEl.style.color = 'var(--danger)';
        return;
      }
      order.checkoutSignatureStudent = studentSig.trim();
      order.checkoutSignatureStaff = staffSig.trim();
      order.status = 'checked_out';
      order.checkoutTimestamp = new Date().toISOString();
      try{
        await saveOrder(order);
        statusEl.textContent = '✅ Checkout complete.';
        statusEl.style.color = 'var(--success)';
        setTimeout(()=>renderOrderDetail(order.reservationNumber), 600);
      }catch(err){
        statusEl.textContent = '⚠ Could not save — ' + err.message;
        statusEl.style.color = 'var(--danger)';
      }
    });
  }
  draw();
}

async function renderOrderDetail(resNum){
  const content = document.getElementById('orderContent');
  const order = await getOrder(resNum);
  if(!order){ content.innerHTML = '<div class="empty-state">Order not found.</div>'; return; }

  if(order.status === 'draft'){
    renderDraftFinishUI(content, order);
    return;
  }

  content.innerHTML = `
    <button class="btn secondary" id="backBtn" type="button">← Back</button>
    <div class="card" style="margin-top:12px;">
      <strong>${order.reservationNumber}</strong> — ${order.studentName}
      <span class="status-badge">${(order.status||'').replace('_',' ')}</span>
      ${order.archived ? '<span class="status-badge" style="background:#6E6C61; color:#fff;">ARCHIVED</span>' : ''}
      ${order.checkoutTimestamp ? `<div style="font-size:12px; color:var(--text-faint); margin-top:6px;">Checked out: ${new Date(order.checkoutTimestamp).toLocaleString()}</div>` : ''}
      ${order.checkinTimestamp ? `<div style="font-size:12px; color:var(--text-faint);">Checked in: ${new Date(order.checkinTimestamp).toLocaleString()}</div>` : ''}

      ${(order.kits||[]).map(k => `
        <div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--line-soft);">
          <div style="font-weight:700; margin-bottom:6px;">${k.name}${k.unitId ? ` [Unit ${k.unitId}]` : ''}</div>
          ${(k.items||[]).map(it => `
            <div class="checklist-row" style="cursor:default;">
              <span style="font-size:14px;">${it.checked ? '✅' : '⬜'}</span>
              <span style="${it.checked ? '' : 'color:var(--text-faint);'}">${it.item}</span>
              ${it.optional ? '<span class="badge approval" style="margin-left:6px;">Optional / Per Request</span>' : ''}
              ${it.note ? `<span style="margin-left:auto; color:var(--danger); font-size:12.5px;">⚠ ${it.note}</span>` : ''}
            </div>
          `).join('') || '<div style="font-size:12.5px; color:var(--text-faint);">No itemized checklist saved for this kit.</div>'}
        </div>
      `).join('')}

      <div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--line-soft); font-size:12.5px; color:var(--text-muted);">
        <div>Student signature: <strong style="color:var(--text);">${order.checkoutSignatureStudent || '(none recorded)'}</strong></div>
        <div>Staff signature: <strong style="color:var(--text);">${order.checkoutSignatureStaff || '(none recorded)'}</strong></div>
      </div>

      ${order.status === 'checked_out' ? `<button class="btn" id="checkInBtn" type="button" style="margin-top:16px;">Complete Check-In</button>` : ''}
      ${order.status === 'checked_in' ? `
        <div style="margin-top:16px;">
          <button class="btn secondary" id="archiveBtn" type="button">${order.archived ? '↩ Un-archive this order' : '📦 Archive this order'}</button>
        </div>
      ` : ''}
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=>{ lookupOpenOrder = null; renderOrdersPage(); });
  const archiveBtn = document.getElementById('archiveBtn');
  if(archiveBtn){
    archiveBtn.addEventListener('click', async ()=>{
      if(!requireStaffAuth('archive or un-archive an order')) return;
      await setOrderArchived(resNum, !order.archived);
      renderOrderDetail(resNum);
    });
  }
  const checkInBtn = document.getElementById('checkInBtn');
  if(checkInBtn){
    checkInBtn.addEventListener('click', async ()=>{
      if(!requireStaffAuth('complete a check-in')) return;
      order.status = 'checked_in';
      order.checkinTimestamp = new Date().toISOString();
      await saveOrder(order);
      renderOrderDetail(resNum);
    });
  }
}

async function renderUpdateLog(){
  const el = document.getElementById('page-updatelog');
  const items = await getUpdateLogItems();
  const lastReviewed = await getLastReviewedDate();
  const open = items.filter(i => !i.done);
  const done = items.filter(i => i.done);
  el.innerHTML = `

    <div class="order-field-row">
      <input type="text" id="newUpdateInput" placeholder="Describe an update to make…" style="flex:1;">
      <button class="btn" id="addUpdateBtn" type="button">+ Add</button>
    </div>

    if(!confirm('This will overwrite current data with what\'s in this backup file. Only continue if something has actually been lost. Proceed?')){
      e.target.value = '';
      return;
    }
    try{
      const text = await file.text();
      const backup = JSON.parse(text);
      statusEl.textContent = 'Restoring…';
      statusEl.style.color = 'var(--text-muted)';
      const count = await restoreFromBackup(backup);
      statusEl.textContent = `✅ Restored ${count} records. Refresh the page to see the restored data.`;
      statusEl.style.color = 'var(--success)';
    }catch(err){
      statusEl.textContent = '⚠ Could not restore — ' + err.message + ' (is this a valid backup file?)';
      statusEl.style.color = 'var(--danger)';
    }
    e.target.value = '';
  });
}

function downloadEmbeddedFile(base64Data, filename, mimeType){
  try{
    const byteChars = atob(base64Data);
    const byteNumbers = new Array(byteChars.length);
    for(let i = 0; i < byteChars.length; i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type: mimeType});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){
    alert('⚠ Could not download this file. Try again, or ask for a fresh copy.');
  }
}

function renderTraineeSelect(){
  const sel = document.getElementById('traineeSelect');
  if(!sel) return;
  const prevValue = currentTraineeId || '';
  sel.innerHTML = '<option value="">— Select a trainee —</option>' +
    traineeList.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  if(traineeList.some(t => String(t.id) === prevValue)) sel.value = prevValue;

  if(!sel.dataset.listenerAttached){
    sel.dataset.listenerAttached = 'true';
    sel.addEventListener('change', async (e)=>{ await selectTrainee(e.target.value); });
  }

  const addBtn = document.getElementById('addTraineeBtn');
  if(addBtn && !addBtn.dataset.listenerAttached){
    addBtn.dataset.listenerAttached = 'true';
    addBtn.addEventListener('click', async ()=>{
      if(!requireStaffAuth('add a trainee')) return;
      const input = document.getElementById('newTraineeName');
      const name = input.value.trim();
      if(!name) return;
      try{
        const newId = await addTrainee(name);
        input.value = '';
        await loadTraineeList();
        document.getElementById('traineeSelect').value = newId;
        await selectTrainee(newId);
      }catch(e){
        alert('⚠ Could not save — ' + e.message);
      }
    });
  }

  const mergeBtn = document.getElementById('mergeDuplicatesBtn');
  if(mergeBtn && !mergeBtn.dataset.listenerAttached){
    mergeBtn.dataset.listenerAttached = 'true';
    mergeBtn.addEventListener('click', async ()=>{
      if(!requireStaffAuth('clean up duplicate trainees')) return;
      const msgEl = document.getElementById('mergeDuplicatesMsg');
      if(!confirm('This scans all trainees, merges progress for any sharing the exact same name, and deletes the extras. Nothing marked done gets lost — proceed?')) return;
      msgEl.textContent = 'Checking for duplicates…';
      msgEl.style.color = 'var(--text-muted)';
      try{
        const summary = await mergeDuplicateTrainees();
        if(!summary.length){
          msgEl.textContent = '✅ No duplicates found.';
        } else {
          msgEl.textContent = '✅ Cleaned up: ' + summary.map(s => `${s.name} (removed ${s.duplicatesRemoved} duplicate${s.duplicatesRemoved===1?'':'s'})`).join(', ');

      }catch(e){
        msgEl.textContent = '⚠ Could not clean up — ' + e.message;

function renderTraineeTracker(){

  if(!body) return;
  if(!currentTraineeId || !currentTraineeData){ body.innerHTML = ''; return; }

  const milestones = currentTraineeData.milestones || {};

  const milestonesDone = Object.values(milestones).filter(Boolean).length;
  const kitsDone = Object.values(kits).filter(Boolean).length;

  body.innerHTML = `

  const content = document.getElementById('traineeTrackerContent');

        const key = e.target.dataset.kitKey;
        const newVal = e.target.checked;
        try{
          await setTraineeKitMastery(currentTraineeId, key, newVal);
          currentTraineeData.kits[key] = newVal;
          renderTraineeTracker();
        }catch(err){
          e.target.checked = !newVal;
          alert('⚠ Could not save — ' + err.message);
        }
      });
    });
  }
}

// ---------------- Room Reservations ----------------
function renderRoomsPage(){
  const el = document.getElementById('page-rooms');
  el.innerHTML = `
    <div class="callout">Reserve a room remotely from any device — no need to walk up to the QR code on the door.</div>
    <div class="card">${ROOM_RESERVATION_RULES}</div>
    <div class="room-grid">
      ${ROOMS.map(r => `
        <div class="room-card">
          ${r.photoDataUrl ? `<img src="${r.photoDataUrl}" alt="${r.name}">` : `<div class="room-photo-missing">No photo yet</div>`}
          <div class="room-body">
            <div class="room-name">${r.name}</div>
            ${r.reserveUrl ? `<a class="btn room-reserve-btn" href="${r.reserveUrl}" target="_blank" rel="noopener">Reserve This Room</a>` : `<div class="room-reserve-pending">Reservation link coming soon</div>`}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

async function init(){
  ALL_KITS = await getAllKits();
  try{
    kitMediaIndex = await getMediaIndex();
  }catch(e){
    kitMediaIndex = {};
    console.warn('Could not load kit media status (check Firestore rules for the kitMedia collection):', e.message);
  }
  renderOrdersPage();
  renderKitsPage();
  renderIndexPage();
}
init();
</script>
