<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regent Equipment Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23F7F6F2'/%3E%3Crect x='24' y='22' width='24' height='16' rx='3' fill='%2328271F'/%3E%3Crect x='14' y='36' width='72' height='46' rx='8' fill='%2328271F'/%3E%3Crect x='68' y='44' width='10' height='6' rx='1.5' fill='%23F7F6F2'/%3E%3Ccircle cx='50' cy='60' r='19' fill='%23E8A33D'/%3E%3Ccircle cx='50' cy='60' r='12' fill='%2328271F'/%3E%3Ccircle cx='50' cy='60' r='6' fill='%233A3A32'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F7F6F2; --panel:#FFFFFF; --line:#DEDBD2; --line-soft:#EAE7E0;
    --text:#28271F; --text-muted:#6E6C61; --text-faint:#9A978A;
    --amber:#E8A33D; --amber-dim:#B87F22; --danger:#B23B3B; --success:#2E8B5C;
    --slate:#26303B; --rust:#A85D3F; --olive:#8A8A4E;
    --freshman:#4CAF7A; --sophomore:#3F93D1; --junior:#9B72CC; --senior:#C6862A; --special:#9DA0A6;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Arial,sans-serif; font-size:15px;}
  .header{background:var(--slate); padding:20px 28px;}
  .header h1{font-size:26px; margin:0; font-weight:800; color:#fff;}
  .header h1 span{color:var(--amber);}
  .tab-nav{display:flex; gap:4px; padding:0 28px; background:var(--slate); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .tab-nav::-webkit-scrollbar{display:none;}
  .tab-btn{background:none; border:none; border-bottom:3px solid transparent; padding:14px 4px; margin-right:20px; font-size:14px; font-weight:600; color:rgba(255,255,255,0.55); cursor:pointer; transition:color 0.15s;}
  .tab-btn:hover{color:rgba(255,255,255,0.85);}
  .tab-btn.active{color:var(--amber); border-bottom-color:var(--amber);}
  .tab-btn[data-page="launchchecklist"]{color:var(--danger) !important;}
  .tab-btn[data-page="launchchecklist"].active{color:var(--danger); border-bottom-color:var(--danger);}
  .page{max-width:1180px; margin:0 auto; padding:24px 28px 60px;}
  .callout{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:6px; padding:14px 16px; margin-bottom:20px; font-size:13.5px; color:var(--text-muted);}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px 18px; margin-bottom:12px;}
  input, select, textarea, button{font-family:inherit;}
  input, select, textarea{background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:9px 12px; font-size:14px; color:var(--text);}
  .btn{background:var(--amber); color:#fff; border:none; border-radius:6px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn:hover{background:var(--amber-dim);}
  .btn.secondary{background:transparent; color:var(--text); border:1px solid var(--line);}
  .grade-chip{display:inline-block; padding:6px 14px; border-radius:20px; border:1px solid var(--line); margin-right:6px; cursor:pointer; font-size:13px;}
  .grade-chip.active{background:var(--amber); color:#fff; border-color:var(--amber);}
  .kit-card{border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:8px; background:var(--panel);}
  .kit-name{font-weight:700;}
  .badge{font-size:10.5px; text-transform:uppercase; padding:2px 8px; border-radius:20px; margin-left:8px;}
  .badge.ok{background:rgba(46,139,92,0.12); color:var(--success);}
  .badge.blocked{background:rgba(178,59,59,0.1); color:var(--danger);}
  .badge.approval{background:rgba(198,134,42,0.14); color:var(--amber-dim);}
  .empty-state{color:var(--text-faint); padding:20px; text-align:center;}
  .order-field-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .selected-kit-chip{display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:5px 12px; margin:4px 4px 4px 0; font-size:13px;}
  .status-badge{font-size:11px; text-transform:uppercase; padding:3px 9px; border-radius:20px; background:var(--line-soft); margin-left:8px;}
  .sync-indicator{font-size:11px; color:var(--success); display:inline-flex; align-items:center; gap:4px;}
  .checklist-row{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line-soft);}
  .card ol, .card ul{padding-left:20px;}
  .card li{margin-bottom:6px;}
  .card .callout{margin-top:10px;}
  .card code{background:var(--bg); padding:2px 6px; border-radius:4px; font-size:12.5px;}
  .tape{
    font-family:monospace; font-size:10px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;
    color:#1B1D21; padding:4px 9px; border-radius:4px; white-space:nowrap; flex-shrink:0;
  }
  .tape[data-tier="freshman"]{background:var(--freshman);}
  .tape[data-tier="sophomore"]{background:var(--sophomore);}
  .tape[data-tier="junior"]{background:var(--junior);}
  .tape[data-tier="senior"]{background:var(--senior);}
  .tape[data-tier="special"]{background:var(--special);}
  .item-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .detail-row{display:flex; gap:8px; font-size:12.5px; padding:3px 0;}
  .detail-row .detail-label{color:var(--text-faint); min-width:150px; flex-shrink:0;}
  .detail-row .detail-value.empty{color:var(--text-faint); font-style:italic;}
  .note-flag{color:var(--danger); font-size:12.5px; margin-top:6px;}
  .qa{margin-bottom:12px; font-size:14px; line-height:1.5;}
  .qa .q{font-weight:700; margin-bottom:2px;}
  .trainee-select-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .trainee-select-row select{min-width:200px;}
  .trainee-select-row input{flex:1; min-width:160px;}
  .trainee-progress-summary{
    display:flex; gap:22px; flex-wrap:wrap; margin-bottom:16px; padding:12px 14px;
    background:rgba(0,0,0,0.02); border-radius:6px; border:1px solid var(--line-soft);
  }
  .trainee-progress-stat{display:flex; flex-direction:column; gap:2px;}
  .trainee-progress-stat .num{font-family:monospace; font-size:20px; font-weight:700; color:var(--amber);}
  .trainee-progress-stat .label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.03em;}
  .milestone-week-block{margin-bottom:14px;}
  .milestone-week-title{font-family:monospace; font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px;}
  .milestone-item{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:14px;}
  .milestone-item.done label{color:var(--text-faint); text-decoration:line-through;}
  .kit-mastery-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:6px 14px;
    max-height:420px; overflow-y:auto; padding:10px 4px; border:1px solid var(--line-soft); border-radius:6px;
  }
  .kit-mastery-item{display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0;}
  .kit-mastery-item.mastered label{color:var(--success);}
  .trainee-tab-row{display:flex; gap:8px; margin-bottom:14px; border-bottom:1px solid var(--line);}
  .trainee-tab-btn{
    background:none; border:none; border-bottom:2px solid transparent; padding:8px 4px; margin-bottom:-1px;
    color:var(--text-faint); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  }
  .trainee-tab-btn.active{color:var(--amber); border-bottom-color:var(--amber);}
  .media-tabs{display:flex; gap:2px; margin-bottom:10px;}
  .media-tab-btn{
    font-family:monospace; font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase;
    background:var(--bg); border:1px solid var(--line); color:var(--text-faint);
    padding:6px 12px; cursor:pointer; border-radius:3px;
  }
  .media-tab-btn.active{color:var(--amber); border-color:var(--amber-dim);}
  .media-pane{display:none;}
  .media-pane.active{display:block;}
  .photo-empty{
    border:1.5px dashed var(--line); border-radius:6px; padding:26px 16px; text-align:center;
    color:var(--text-faint); font-size:13px;
  }
  .photo-empty input[type=file]{margin-top:10px;}
  .photo-wrap{position:relative; display:inline-block; max-width:100%; border-radius:6px; overflow:hidden; border:1px solid var(--line);}
  .photo-wrap img{display:block; max-width:100%; height:auto;}
  .hotspot-pin{
    position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px;
    background:var(--amber); color:#1B1D21; border-radius:50%;
    font-family:monospace; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    border:2px solid #1B1D21; box-shadow:0 0 0 1px var(--amber);
  }
  .hotspot-pin:hover .hotspot-label{display:block;}
  .hotspot-label{
    display:none; position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    background:#1B1D21; color:#fff; font-size:12px; font-weight:500;
    padding:5px 9px; border-radius:3px; white-space:nowrap; border:1px solid var(--line); z-index:5;
  }
  .media-btn-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .media-btn{
    font-size:12px; font-weight:600; color:var(--text);
    background:var(--bg); border:1px solid var(--line); border-radius:3px;
    padding:6px 12px; cursor:pointer;
  }
  .media-btn:hover{border-color:var(--text-faint);}
  .media-btn.danger{color:#BF5B56;}
  .label-mode-active .photo-wrap{cursor:crosshair; outline:2px solid var(--amber);}
  .video-empty{
    border:1.5px dashed var(--line); border-radius:6px; padding:20px 16px; text-align:center; color:var(--text-faint); font-size:13px;
  }
  .video-input-row{display:flex; gap:8px; margin-top:10px;}
  .video-input-row input{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:3px; color:var(--text);
    font-size:13px; padding:8px 10px;
  }
  .video-frame-wrap{position:relative; width:100%; padding-top:56.25%; border-radius:6px; overflow:hidden; border:1px solid var(--line);}
  .video-frame-wrap iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
  .media-hint{font-size:11.5px; color:var(--text-faint); margin-top:6px;}
  mark{background:#FCE8C4; color:inherit; padding:0 1px; border-radius:2px;}
  .room-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; margin-top:16px;}
  .room-card{background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column;}
  .room-card img{width:100%; height:180px; object-fit:cover; display:block;}
  .room-card .room-photo-missing{width:100%; height:180px; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:12.5px;}
  .room-card .room-body{padding:12px 14px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .room-card .room-name{font-weight:700; font-size:14.5px;}
  .room-reserve-btn{align-self:flex-start; margin-top:auto;}
  .room-reserve-pending{font-size:12px; color:var(--text-faint); font-style:italic; margin-top:auto;}
  .kit-detail ul, .kit-detail ol{margin:0 0 4px; padding-left:20px;}
  .kit-detail li{margin-bottom:5px;}
  .kit-contents-list li{color:var(--text);}
  .kit-perreq-list li{color:var(--text-muted); font-style:italic;}
  .kit-detail h4{margin:14px 0 6px;}
  .kit-detail h4:first-child{margin-top:0;}
  .kit-detail .note-callout{
    background:rgba(232,163,61,0.08); border:1px solid var(--amber-dim); border-radius:6px;
    padding:10px 12px; margin:6px 0 10px; font-size:13px; color:#9C6B1F;
  }
  .kit-detail .review-note{
    background:rgba(199,203,209,0.08); border:1px solid var(--special); border-radius:6px;
    padding:10px 12px; margin:6px 0 10px; font-size:13px; color:var(--special);
  }
  .kit-detail .eligibility-note{
    background:rgba(178,59,59,0.07); border:1px solid rgba(178,59,59,0.35); border-radius:6px;
    padding:10px 12px; margin:6px 0 10px; font-size:13px; color:var(--danger);
  }
  .kit-detail .eligibility-note.approval{background:rgba(157,160,166,0.08); border-color:var(--special); color:var(--special);}
  .kit-detail .eligibility-note.linked{background:rgba(198,134,42,0.08); border-color:var(--amber-dim); color:var(--amber-dim);}
  .kit-detail .eligibility-note.ok{background:rgba(46,139,92,0.08); border-color:rgba(46,139,92,0.4); color:var(--success);}
  footer.page-footer{
    text-align:center; padding:24px 20px 40px; font-size:11.5px; color:var(--text-faint);
    font-family:monospace;
  }

  /* ---------- Visual identity: warm earth-tone category system (rust + olive) ---------- */
  :root{
    --cat-lighting:var(--olive); --cat-camera:var(--rust); --cat-audio:var(--rust);
    --cat-grip:var(--olive); --cat-lens:var(--rust); --cat-support:var(--olive);
    --cat-monitor:var(--rust); --cat-accessory:var(--olive);
  }
  /* A thin strip of film-sprocket holes — used sparingly as a signature divider */
  .sprocket-rule{
    height:10px; margin:0 0 18px;
    background-image: radial-gradient(circle, var(--line) 2px, transparent 2.4px);
    background-size: 16px 10px; background-position: 0 center; background-repeat: repeat-x;
    opacity:0.9;
  }
  .header{position:relative;}
  .tab-btn .tab-icon{margin-right:6px; font-size:13px; opacity:0.9;}
  .tab-btn.active .tab-icon{opacity:1;}
  /* Cards that are actually clickable get a little lift on hover — cards that
     aren't (plain info panels) keep their flat, quiet look */
  .kit-card[data-kit-id]:hover, .kit-card[data-item-id]:hover,
  .card[data-sop-id]:hover, .card[data-policy-id]:hover, .card[data-cheq-id]:hover,
  .card[data-res-card]:hover, .card[data-maint-idx]:hover, .card[data-open]:hover{
    box-shadow: 0 2px 10px rgba(40,39,31,0.07); transform: translateY(-1px);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .empty-state::before{content:'🗂️  '; opacity:0.6;}
  .category-chip-icon{margin-right:5px;}
  /* Category chips get a soft tint from their own accent color when active,
     instead of every category collapsing into the same amber-everything look */
  .grade-chip[data-cat].active{ border-color: transparent; color:#fff; }
  .grade-chip[data-cat="Lighting Kits"].active{background:var(--cat-lighting);}
  .grade-chip[data-cat="Camera Kits"].active{background:var(--cat-camera);}
  .grade-chip[data-cat="Audio Kits"].active{background:var(--cat-audio);}
  .grade-chip[data-cat="Grip & Filter Kits"].active{background:var(--cat-grip);}
  .grade-chip[data-cat="Lens Kits"].active{background:var(--cat-lens);}
  .grade-chip[data-cat="Support & Rig Kits"].active{background:var(--cat-support);}
  .grade-chip[data-cat="Monitors & Video Kits"].active{background:var(--cat-monitor);}
  .grade-chip[data-cat="Accessory Kits"].active{background:var(--cat-accessory);}
  </style>
</head>
<body>

<div class="header" style="display:flex; justify-content:space-between; align-items:center;">
  <h1>REGENT <span>EQUIPMENT OFFICE</span></h1>
  <div id="authArea" style="font-size:13px;"></div>
</div>
<div class="sprocket-rule"></div>

<div id="loginModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center;">
  <div class="card" style="max-width:340px; width:90%; background:#fff;">
    <strong style="display:block; margin-bottom:10px;">Staff Login</strong>
    <input type="text" id="loginEmail" placeholder="Staff username or email" style="width:100%; margin-bottom:8px; box-sizing:border-box;">
    <input type="password" id="loginPassword" placeholder="Password" style="width:100%; margin-bottom:10px; box-sizing:border-box;">
    <div id="loginError" style="color:var(--danger); font-size:12.5px; margin-bottom:8px;"></div>
    <div style="display:flex; gap:8px;">
      <button class="btn" id="loginSubmitBtn" type="button">Log In</button>
      <button class="btn secondary" id="loginCancelBtn" type="button">Cancel</button>
    </div>
  </div>
</div>

<div class="tab-nav">
  <button class="tab-btn active" data-page="orders" type="button">Check Out-In</button>
  <button class="tab-btn" data-page="kits" type="button">Kit ID</button>
  <button class="tab-btn" data-page="index" type="button">Index</button>
  <button class="tab-btn" data-page="sops" type="button">Staff</button>
  <button class="tab-btn" data-page="cheqroom" type="button">Cheqroom</button>
  <button class="tab-btn" data-page="policy" type="button">Policy</button>
  <button class="tab-btn" data-page="rooms" type="button">Rooms</button>
  <button class="tab-btn" data-page="launchchecklist" type="button">🚀 Launch Checklist</button>
  <button class="tab-btn" data-page="documents" type="button">Docs</button>
  <button class="tab-btn" data-page="checkinreview" type="button">To Review</button>
  <button class="tab-btn" data-page="updatelog" type="button">Updates</button>
</div>

<div id="page-orders" class="page"></div>
<div id="page-kits" class="page" style="display:none;"></div>
<div id="page-index" class="page" style="display:none;"></div>
<div id="page-checkinreview" class="page" style="display:none;"></div>
<div id="page-updatelog" class="page" style="display:none;"></div>
<div id="page-sops" class="page" style="display:none;"></div>
<div id="page-cheqroom" class="page" style="display:none;"></div>
<div id="page-policy" class="page" style="display:none;"></div>
<div id="page-rooms" class="page" style="display:none;"></div>
<div id="page-launchchecklist" class="page" style="display:none;"></div>
<div id="page-documents" class="page" style="display:none;"></div>

<footer class="page-footer">
  Equipment Office · (757) 352-4240 · equipment@regent.edu — This tool is a quick-reference supplement to Cheqroom. The Student Handbook and Policy Manual govern in case of any discrepancy.
</footer>

<script type="module">
import {
  getAllKits, getKit, getOrder, saveOrder, listOrders, setOrderArchived,
  addConditionLogEntry, getConditionLogForKit, resolveConditionLogEntry,
  getAllOpenConditionLogs,
  addUpdateLogItem, getUpdateLogItems, toggleUpdateLogItem, deleteUpdateLogItem,
  setLastReviewedDate, getLastReviewedDate, watchCollection,
  getMediaIndex, setKitMediaStatus,
  signInStaff, signOutStaff, onAuthStateChange, getCurrentUser,
  exportFullBackup, restoreFromBackup,
  addTrainee, getAllTrainees, getTrainee, setTraineeMilestone, setTraineeKitMastery, mergeDuplicateTrainees,
  getFlaggedCheckIns, resolveMissingItem,
  getLaunchChecklistState, setLaunchChecklistItem,
  getSopVideoLinks, setSopVideoLink, removeSopVideoLink,
  getTrainingVideos, addTrainingVideo, removeTrainingVideo,
  updateKitData, applyIvyBatch4Updates,
  getCheqroomVideoLinks, setCheqroomVideoLink, removeCheqroomVideoLink,
  getKitPhotos, addKitPhoto, removeKitPhotoAt, setPhotoCaption, setPhotoHotspots,
  saveKitVideoLink, removeKitVideo,
} from "./firebase-data.js";
import { SOP_SECTIONS } from "./sops_data.js";
import { CHEQROOM_SECTIONS } from "./cheqroom_data.js";
import { SHELF_LOCATIONS } from "./shelf_locations_data.js";
import { POLICY_SECTIONS, POLICY_TOPICS } from "./policies_data.js";
import { EMBEDDED_DOCS } from "./documents_data.js";
import { ITEMS, TIER_LABELS, CATEGORIES } from "./items_data.js";
import { ROOMS, ROOM_RESERVATION_RULES } from "./rooms_data.js";

const STUDENT_TIER_LABELS = {freshman:"Freshman", sophomore:"Sophomore", junior:"Junior", senior:"Senior+", professor:"Professor"};
const CATEGORY_ICONS = {
  "Lighting Kits":"💡", "Grip & Filter Kits":"🔧", "Camera Kits":"🎥", "Lens Kits":"🔍",
  "Support & Rig Kits":"🔩", "Audio Kits":"🎙️", "Monitors & Video Kits":"🖥️", "Accessory Kits":"🧰",
};
const STUDENT_TIER_RANK = {freshman:1, sophomore:2, junior:3, senior:4, professor:5};

let ALL_KITS = [];
let studentGrade = null;
let kitSearchTerm = '';
let kitActiveCategories = new Set();
let openKitId = null;

// ---------------- Tab switching ----------------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['orders','kits','index','updatelog','sops','policy','documents','rooms','checkinreview','launchchecklist','cheqroom'].forEach(p=>{
      document.getElementById('page-'+p).style.display = (p===btn.dataset.page) ? '' : 'none';
    });
    if(btn.dataset.page === 'rooms') renderRoomsPage();
    if(btn.dataset.page === 'updatelog') renderUpdateLog();
    if(btn.dataset.page === 'sops'){ renderStaff(); loadTraineeList(); }
    if(btn.dataset.page === 'policy') renderPolicy();
    if(btn.dataset.page === 'documents') renderDocumentsList();
    if(btn.dataset.page === 'checkinreview') renderCheckInReviewPage();
    if(btn.dataset.page === 'launchchecklist') renderLaunchChecklistPage();
    if(btn.dataset.page === 'cheqroom') renderCheqroomPage();
  });
});

// ---------------- Eligibility (ported exactly from the original tool) ----------------
function eligibility(kit, gradeOverride){
  const grade = gradeOverride !== undefined ? gradeOverride : studentGrade;
  if(kit.gradeApproval) return {status:'approval', label:'Requires special clearance'};
  if(kit.gradeLinked) return {status:'linked', label:'Depends on paired camera'};
  if(!kit.gradeTier) return {status:'none', label:null};
  if(!grade) return {status:'none', label:`Requires ${STUDENT_TIER_LABELS[kit.gradeTier]}+`};
  const need = STUDENT_TIER_RANK[kit.gradeTier];
  const have = STUDENT_TIER_RANK[grade];
  if(have >= need) return {status:'ok', label:`Cleared — ${STUDENT_TIER_LABELS[kit.gradeTier]}+ kit`};
  return {status:'blocked', label:`Not allowed — requires ${STUDENT_TIER_LABELS[kit.gradeTier]}+`};
}

function handlePhotoUpload(kit, file, caption){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = async ()=>{
      // Try progressively smaller/more compressed versions rather than
      // failing on the first attempt — a real, detailed photo can easily
      // exceed the per-photo limit at the initial size, and most photos
      // still look perfectly fine as a kit reference at a smaller size.
      const attempts = [
        {maxW: 650, quality: 0.65},
        {maxW: 500, quality: 0.55},
        {maxW: 400, quality: 0.45},
        {maxW: 320, quality: 0.4},
        {maxW: 260, quality: 0.35},
      ];
      let dataUrl = null;
      for(const {maxW, quality} of attempts){
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const candidate = canvas.toDataURL('image/jpeg', quality);
        if(candidate.length <= 190000){ dataUrl = candidate; break; }
      }
      if(!dataUrl){
        alert('⚠ This photo is unusually large even after compression — try a different photo, or a screenshot of it instead.');
        return;
      }
      try{
        await addKitPhoto(kit.id, dataUrl, caption);
        await setKitMediaStatus(kit.id, 'photo', true);
        if(!kitMediaIndex[kit.id]) kitMediaIndex[kit.id] = {photo:false, video:false};
        kitMediaIndex[kit.id].photo = true;
      }catch(err){
        alert('⚠ ' + err.message);
        return;
      }
      loadPhotoPane(kit);
      refreshMediaBadgeOnly(kit.id);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// YouTube's own "Embed" button gives you a full <iframe> HTML snippet to
// copy, not a plain link — pasting that whole snippet in used to break the
// page, since the quotes inside it closed our own src="..." early and the
// rest rendered as literal text. This pulls the real URL out either way.
// Wraps matches of `term` in <mark> — safe against HTML in `html`, since it
// only touches text between tags, never the tags/attributes themselves, so a
// search term can never corrupt markup even if it happens to match a class
// name or similar. Works fine on plain text too (no tags = one text segment).
function highlightMatch(html, term){
  if(!term) return html;
  const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${escaped})`, 'gi');
  return html.split(/(<[^>]+>)/g).map(part =>
    part.startsWith('<') ? part : part.replace(re, '<mark>$1</mark>')
  ).join('');
}

function extractVideoUrl(input){
  const iframeMatch = input.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);
  return iframeMatch ? iframeMatch[1] : input;
}

// Defense-in-depth: even a clean-looking URL could contain a stray quote
// character, which would otherwise break out of the src="..."/href="..."
// attribute it's inserted into and render as literal text on the page.
function escapeHtmlAttr(str){
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderVideoPane(kit, pane, videoUrl){
  if(!videoUrl){
    pane.innerHTML = `
      <div class="video-empty">No setup/testing video yet.</div>
      <div class="video-input-row">
        <input type="text" placeholder="Paste a YouTube (Unlisted) or Vimeo embed link…" id="video-input-${kit.id}">
        <button class="media-btn" data-action="savevideo" type="button">Save</button>
      </div>
      <div class="media-hint">Record on the iPad → upload to YouTube as <strong>Unlisted</strong> (not Private) → Share → Embed → paste that link here. Either the plain link or the full embed code YouTube gives you works — both are handled. See the Staff tab for the full walkthrough.</div>`;
    pane.querySelector('[data-action="savevideo"]').addEventListener('click', async ()=>{
      if(!requireStaffAuth('save a setup video link')) return;
      let val = pane.querySelector(`#video-input-${kit.id}`).value.trim();
      if(!val) return;
      val = extractVideoUrl(val);
      // Without a protocol, an iframe/link treats this as a path on THIS site
      // rather than an external URL — that's what actually causes a Netlify
      // 404 instead of a real video, so it has to be caught before saving.
      if(!/^https?:\/\//i.test(val)){
        val = 'https://' + val;
      }
      try{
        await saveKitVideoLink(kit.id, val);
        await setKitMediaStatus(kit.id, 'video', true);
        if(!kitMediaIndex[kit.id]) kitMediaIndex[kit.id] = {photo:false, video:false};
        kitMediaIndex[kit.id].video = true;
      }catch(e){
        alert('Could not save video link.'); return;
      }
      loadVideoPane(kit);
      refreshMediaBadgeOnly(kit.id);
    });
    return;
  }
  // Clean up the URL for display even if something malformed is already
  // saved from before this fix existed — no need to make anyone re-paste it.
  const cleanVideoUrl = escapeHtmlAttr(extractVideoUrl(videoUrl));
  pane.innerHTML = `
    <div class="video-frame-wrap"><iframe src="${cleanVideoUrl}" allowfullscreen></iframe></div>
    <div class="media-btn-row">
      <a class="media-btn" href="${cleanVideoUrl}" target="_blank" rel="noopener" style="text-decoration:none; display:inline-block;">🔗 Open Video Link Directly</a>
      <button class="media-btn danger" data-action="clearvideo" type="button">🗑️ Remove Video</button>
    </div>`;
  pane.querySelector('[data-action="clearvideo"]').addEventListener('click', async ()=>{
    if(!requireStaffAuth('remove a video link')) return;
    if(!confirm('Remove this video link?')) return;
    try{
      await removeKitVideo(kit.id);
      await setKitMediaStatus(kit.id, 'video', false);
      if(!kitMediaIndex[kit.id]) kitMediaIndex[kit.id] = {photo:false, video:false};
      kitMediaIndex[kit.id].video = false;
    }catch(e){}
    loadVideoPane(kit);
    refreshMediaBadgeOnly(kit.id);
  });
}

        overlay.querySelector('#resolveConfirmBtn').textContent = 'Saving…';
        await resolveConditionLogEntry(entryId, name);
        overlay.remove();
        loadConditionLogForCard(kitId);
      });
    });
  });
}

let indexActiveGrades = new Set();
let indexActiveCategories = new Set();
let indexSearchTerm = '';
let indexExpandedId = null;

function indexItemMatches(item){
  if(indexActiveGrades.size && !indexActiveGrades.has(item.tier)) return false;
  if(indexActiveCategories.size && !indexActiveCategories.has(item.category)) return false;
  if(indexSearchTerm){
    const hay = [item.name, item.batteries, item.media, item.tripod, item.grade, (item.lenses||[]).join(' ')].join(' ').toLowerCase();
    if(!hay.includes(indexSearchTerm)) return false;
  }
  return true;
}

function indexDetailRow(label, value, emptyText, term){
  const v = value && value.trim() ? value : null;
  const displayValue = v ? highlightMatch(v, term) : (emptyText||'None specified');
  return `<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-value ${v?'':'empty'}">${displayValue}</span></div>`;
}

function indexCardHTML(item){
  // If the search term only matches something in a collapsed detail field
  // (battery, media, lens, tripod) — not the name or grade, which are always
  // visible — show an indicator rather than forcing the card open, since a
  // forced-open state can't be manually collapsed while the search stays active.
  const term = indexSearchTerm;
  const isOpen = indexExpandedId === item.id;
  const matchesVisibleFields = !term || item.name.toLowerCase().includes(term) || (item.grade||'').toLowerCase().includes(term);
  const matchOnlyInDetails = term && !matchesVisibleFields && !isOpen;
  const lensStr = (item.lenses && item.lenses.length) ? item.lenses.join(' · ') : '';
  return `<div class="kit-card" data-item-id="${item.id}" style="cursor:pointer;">
    <div class="item-card-top">
      <span class="kit-name">${highlightMatch(item.name, term)}</span>
      ${matchOnlyInDetails ? '<span class="badge approval">🔍 match below — click to see</span>' : ''}
      <span class="tape" data-tier="${item.tier}">${TIER_LABELS[item.tier]}</span>
    </div>
    <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${highlightMatch(item.grade, term)}</div>
    ${isOpen ? `
      <div style="margin-top:10px;">
        ${indexDetailRow('Required batteries', item.batteries, 'None required', term)}
        ${indexDetailRow('Required media', item.media, 'N/A', term)}
        ${indexDetailRow('Compatible EO lenses', lensStr, 'N/A', term)}
        ${indexDetailRow('Tripod / stand', item.tripod, 'N/A', term)}
        ${item.notes ? `<div class="note-flag">⚠ ${item.notes}</div>` : ''}
      </div>
    ` : ''}
  </div>`;
}

  `;
  const listEl = document.getElementById('indexList');
  function draw(){
    const filtered = ITEMS.filter(indexItemMatches);
    document.getElementById('indexCount').textContent = filtered.length;
    listEl.innerHTML = filtered.length ? filtered.map(indexCardHTML).join('') : '<div class="empty-state">No equipment matches those filters.</div>';
    listEl.querySelectorAll('[data-item-id]').forEach(card=>{
      card.addEventListener('click', ()=>{
        const id = parseInt(card.dataset.itemId);
        indexExpandedId = (indexExpandedId === id) ? null : id;
        draw();
      });
    });
  }
  document.getElementById('indexSearch').addEventListener('input', e=>{ indexSearchTerm = e.target.value.toLowerCase(); draw(); });
  el.querySelectorAll('[data-tier]').forEach(chip=>{
    chip.addEventListener('click', ()=>{

      if(indexActiveGrades.has(t)) indexActiveGrades.delete(t); else indexActiveGrades.add(t);
      renderIndexPage();
    });
  });
  el.querySelectorAll('[data-cat]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const c = chip.dataset.cat;
      if(indexActiveCategories.has(c)) indexActiveCategories.delete(c); else indexActiveCategories.add(c);
      renderIndexPage();
    });
  });
  draw();
}

const HUB_MAINTENANCE_SECTIONS = [{"title":"The EO's Devices & How They Connect","body":"\n  <p><strong>Everything runs off one single, permanent web address</strong> — not a link that can go stale or point to the wrong version. Bookmark this address on every device (the 3 staff desktops and every student-facing iPad) and that's it — nothing further to manage.</p>\n  <p><strong>No login is required at all.</strong> This is a real, independent website, not something tied to anyone's personal account. Any device with the bookmark can use it, the moment it's opened.</p>\n  <div class=\"callout\">📱 <strong>Device roles, unchanged from before:</strong> the 3 EO desktops are staff-only. The student-facing devices are iPads — every one of them should still be fully EO-owned hardware with nothing personal on it, same reasoning as always (no individual's Apple ID, no personal files), even though the account-login concern that originally drove this is now gone.</div>\n"},{"title":"Updating the Hub","body":"\n  <p>This tool is now a real website with real code, not something living inside a Claude conversation. That changes how updates actually happen, in a good way — more standard, more reliable.</p>\n  <ol>\n    <li><strong>The code lives in a GitHub repository.</strong> Any change — a new feature, a bug fix, a content update — means editing the actual files there (either directly, or by asking Claude to produce updated files and uploading them in).</li>\n    <li><strong>Commit the change.</strong> That's GitHub's word for \"save this change for real.\"</li>\n    <li><strong>Netlify picks it up automatically</strong> and rebuilds the live site within a minute or two — no separate \"get a new link\" step, ever. The address never changes, only what's shown at it does.</li>\n  </ol>\n  <div class=\"callout\">✅ This is meaningfully simpler than the old system. There's no \"wrong version\" risk the way there used to be — one address, one current version, always.</div>\n"},{"title":"Reservation Number Changes at Checkout (Confirmed)","body":"\n  <p><strong>Confirmed: Cheqroom assigns a new number when a Reservation is converted into a Check-out.</strong> This isn't a glitch — it's how Cheqroom is built. The original reservation number staff used while building the order will <strong>not</strong> match the number Cheqroom shows once \"Proceed to Checkout\" happens.</p>\n  <ol>\n    <li>Keep using the original reservation number in this tool throughout — building, student sign-off, and check-in. That number never changes on our end.</li>\n    <li>Once the Cheqroom checkout number is known, add it to that order's <strong>\"Cheqroom Checkout #\"</strong> field in the tool (Check Out-In tab → open the order) so both numbers are on record together.</li>\n    <li>If you ever need to trace an old reservation number back to what it became: in Cheqroom, go to <strong>Reservations → Filters → Status</strong>, and check <strong>Archived</strong> — not \"Closed,\" which will show no results for a fully completed order.</li>\n  </ol>\n"},{"title":"Where Everything Lives","body":"\n  <p>Besides this tool itself, a few companion documents exist from building all this out. <strong>I can tell you what they are — where they currently live is worth pinning down as a team, since that part depends on where you've been saving things.</strong></p>\n  <ul>\n    <li><strong>Kit Paperwork Review List</strong> — open questions for Ivy about specific kits/forms.</li>\n    <li><strong>Kit Photo &amp; Video Shot Guide</strong> — the shot list for photographing/filming each kit.</li>\n    <li><strong>Kit Photography Priority workbook</strong> — which kits to shoot first, based on real usage.</li>\n  </ul>\n  <div class=\"callout\">⚠ Recommended: pick one OneDrive/Google Drive folder (e.g. <code>Equipment Office → Digital Tool Project</code>) as the single home for all of these. Once that's decided, it's worth writing the exact path down here so it's not tribal knowledge.</div>\n"},{"title":"Weekly Backup","body":"\n  <p><strong>The database this tool runs on (Firestore) doesn't automatically back itself up for free.</strong> Real automated backups exist, but they need a paid Google Cloud plan and real technical setup (Cloud Functions, permissions, storage buckets) — not something to take on casually, and not something built into this tool.</p>\n  <p>The practical alternative, built directly into this page: <strong>manually download a full backup regularly — weekly is a reasonable habit.</strong> It saves everything — every kit, order, condition log entry, update log item, trainee record, and photo/video status — into one file you keep somewhere safe (a shared drive folder is a good home for it).</p>\n  <div class=\"callout\">⚠ Restoring from a backup <strong>overwrites</strong> whatever's currently in the live database with whatever's in that file. Only do this if something's actually been lost — it's not a routine action.</div>\n  <p>Both buttons are above, at the top of this section.</p>\n"},{"title":"Uploading a Kit Setup/Testing Video","body":"\n  <p><strong>Recording on the iPad camera is exactly right</strong> — that's the correct way to capture the footage. The extra step below isn't about how you record; it's about what happens after.</p>\n  <p>This tool only stores a <strong>link</strong> to a video, not the video file itself — video files are too large to store directly the way kit photos are. So the actual workflow is:</p>\n  <ol>\n    <li><strong>Record the setup/testing walkthrough on the iPad camera</strong>, same as always.</li>\n    <li><strong>Upload that clip to YouTube, and set it to Unlisted</strong> — not Private. Unlisted means anyone with the link can watch it, but it won't show up in search or on the channel page. Private would block it from playing in the tool at all.</li>\n    <li><strong>Open the video on YouTube, click Share, then Embed</strong> — not the regular \"Share\" link. The Embed option gives you a different link, specifically built to play inside another page.</li>\n    <li><strong>Copy that embed link and paste it into the kit's Video tab</strong> in Kit ID → Manage Photo/Video.</li>\n  </ol>\n  <div class=\"callout\">✅ Vimeo works the same way as a backup option, if YouTube ever gives you trouble. Canva and Adobe Express were tried and specifically ruled out for this — Canva's own video upload is capped at 2–3 per month on the free plan, and Adobe Express has a known issue where published video specifically won't play inside an embedded frame the way this tool needs, even though it embeds other content fine.</div>\n  <p>Once pasted, always double check it actually plays right there in the tool before moving on — that's the real test, not just whether the link looks right.</p>\n"}];

function wireHubMaintenanceHandlers(){
  document.getElementById('downloadBackupBtn').addEventListener('click', async ()=>{
    if(!requireStaffAuth('download a full backup')) return;
    const statusEl = document.getElementById('backupStatusMsg');
    statusEl.textContent = 'Exporting…';
    statusEl.style.color = 'var(--text-muted)';
    try{
      const backup = await exportFullBackup();
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `eo-hub-backup-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      const totalDocs = Object.values(backup.collections).reduce((sum, arr) => sum + arr.length, 0);
      statusEl.textContent = `✅ Backup downloaded — ${totalDocs} records across ${Object.keys(backup.collections).length} collections.`;
      statusEl.style.color = 'var(--success)';
    }catch(e){
      statusEl.textContent = '⚠ Could not export — ' + e.message;
      statusEl.style.color = 'var(--danger)';
    }
  });

  document.getElementById('restoreBackupBtn').addEventListener('click', ()=>{
    if(!requireStaffAuth('restore from a backup')) return;
    document.getElementById('restoreBackupInput').click();
  });
  document.getElementById('restoreBackupInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById('backupStatusMsg');
    if(!confirm('This will overwrite current data with what\'s in this backup file. Only continue if something has actually been lost. Proceed?')){
      e.target.value = '';
      return;
    }
    try{
      const text = await file.text();
      const backup = JSON.parse(text);
      statusEl.textContent = 'Restoring…';
      statusEl.style.color = 'var(--text-muted)';
      const count = await restoreFromBackup(backup);
      statusEl.textContent = `✅ Restored ${count} records. Refresh the page to see the restored data.`;
      statusEl.style.color = 'var(--success)';
    }catch(err){
      statusEl.textContent = '⚠ Could not restore — ' + err.message + ' (is this a valid backup file?)';
      statusEl.style.color = 'var(--danger)';
    }
    e.target.value = '';
  });
  drawHubMaintenanceList();

  const batch4Btn = document.getElementById('applyBatch4Btn');
  if(batch4Btn){
    batch4Btn.addEventListener('click', async ()=>{
      if(!requireStaffAuth('apply grade tier updates')) return;
      if(!confirm('Apply all 42 kit updates from Ivy\'s Sept 2 review? This will update grade tiers, retire kits, and rename VariZoom. It does not affect orders or other data. This is safe to run once.')) return;
      const msg = document.getElementById('batch4StatusMsg');
      batch4Btn.disabled = true;
      msg.style.color = 'var(--text-muted)';
      msg.textContent = 'Applying updates…';
      try{
        const count = await applyIvyBatch4Updates((done, total)=>{
          msg.textContent = `Updating… ${done} of ${total}`;
        });
        msg.style.color = 'var(--success)';
        msg.textContent = `✅ Done — ${count} kits updated. Reload Kit ID to see changes. You can hide this button now.`;
        batch4Btn.textContent = '✅ Already Applied';
        ALL_KITS = await getAllKits();
      }catch(e){
        msg.style.color = 'var(--danger)';
        msg.textContent = '⚠ Error: ' + e.message;
        batch4Btn.disabled = false;
      }
    });
  }
}

    ? newOrderKits.map(inst => ALL_KITS.find(k=>String(k.id)===String(inst.kitId))).filter(k=>k).map(k => ({kit:k, elig: eligibility(k, newOrderStudentGrade)})).filter(m => m.elig.status === 'blocked')
    : [];
  content.innerHTML = `
    <div class="card">
      <div class="order-field-row">
        <select id="studentGradeSelect" style="width:200px;">
          <option value="">— Grade Level —</option>
          <option value="freshman" ${newOrderStudentGrade==='freshman'?'selected':''}>Freshman</option>
          <option value="sophomore" ${newOrderStudentGrade==='sophomore'?'selected':''}>Sophomore</option>
          <option value="junior" ${newOrderStudentGrade==='junior'?'selected':''}>Junior</option>
          <option value="senior" ${newOrderStudentGrade==='senior'?'selected':''}>Senior+</option>
          <option value="professor" ${newOrderStudentGrade==='professor'?'selected':''}>Professor</option>
        </select>
        <input type="text" id="resNumInput" placeholder="Reservation #" value="${newOrderResNum}">
        <input type="text" id="studentNameInput" placeholder="Student name" value="${newOrderStudentName}">
      </div>
      <div class="order-field-row">
        <div><label style="font-size:12px; color:var(--text-faint);">Checkout Date</label><br><input type="date" id="checkoutDateInput" value="${newOrderCheckoutDate}"></div>
        <div><label style="font-size:12px; color:var(--text-faint);">Expected Return Date</label><br><input type="date" id="returnDateInput" value="${newOrderReturnDate}"></div>
      </div>
      ${mismatches.length ? `
        <div class="callout" style="border-left-color:var(--danger);">
          <strong style="color:var(--danger);">⚠ Grade eligibility conflict</strong> — declared <strong>${newOrderStudentGrade}</strong>, but this order includes:
          <ul style="margin:6px 0 10px 18px;">${mismatches.map(m=>`<li><strong>${m.kit.name}</strong> — ${m.elig.label}</li>`).join('')}</ul>
          <label style="display:flex; align-items:flex-start; gap:8px; font-size:13px; margin-bottom:8px;">
            <input type="checkbox" id="gradeOverrideCheck" ${newOrderOverride.ack?'checked':''} style="margin-top:3px;">
            <span>Staff is overriding this on purpose (e.g. professor-approved exception) — required before saving.</span>
          </label>
          <input type="text" id="gradeOverrideReason" placeholder="Reason for override" value="${newOrderOverride.reason||''}" style="width:100%; box-sizing:border-box;">
        </div>
      ` : ''}
      <div id="selectedKitsArea">${newOrderKits.map((inst, idx)=>{
        const k = ALL_KITS.find(x=>String(x.id)===String(inst.kitId));
        const unitVal = newOrderUnitIds[inst.instanceId] || '';
        const sameKitCount = newOrderKits.filter(x=>String(x.kitId)===String(inst.kitId)).length;
        const posAmongSame = newOrderKits.slice(0, idx+1).filter(x=>String(x.kitId)===String(inst.kitId)).length;
        const dupLabel = sameKitCount > 1 ? ` (${posAmongSame} of ${sameKitCount})` : '';
        const kitIssues = openConditionLogs.filter(e => String(e.kitId) === String(inst.kitId));
        const issueWarning = kitIssues.length
          ? `<span style="color:var(--danger); font-size:11px; font-weight:600; margin-left:6px;">⚠ ${kitIssues.length} open issue${kitIssues.length>1?'s':''}: ${kitIssues.map(e=>e.item||e.note||'issue').join(', ')}</span>`
          : '';
        return k ? `<span class="selected-kit-chip">${k.name}${dupLabel}${issueWarning}
          <input type="text" class="order-unit-input" data-unitkit="${inst.instanceId}" placeholder="Unit #" value="${unitVal}" style="width:70px; margin-left:8px; font-size:12px;">
          <button data-remove="${inst.instanceId}" type="button">✕</button></span>` : '';
      }).join('')}</div>
      <input type="text" id="kitPickerSearch" placeholder="Search kits to add…" style="width:100%; margin-bottom:10px;">
      <div id="kitPickerList" style="max-height:200px; overflow-y:auto; border:1px solid var(--line-soft); border-radius:6px; margin-bottom:10px;"></div>
      <button class="btn secondary" id="buildChecklistBtn" type="button" style="margin-top:8px;" ${!newOrderKits.length ? 'disabled' : ''}>Build Combined Checklist ↓</button>
    </div>
    <div id="checklistArea"></div>
  `;
  document.getElementById('studentGradeSelect').addEventListener('change', e=>{ newOrderStudentGrade = e.target.value; renderNewOrderPane(); });
  document.getElementById('resNumInput').addEventListener('input', e=>{ newOrderResNum = e.target.value; });
  document.getElementById('studentNameInput').addEventListener('input', e=>{ newOrderStudentName = e.target.value; });
  document.getElementById('checkoutDateInput').addEventListener('input', e=>{ newOrderCheckoutDate = e.target.value; });
  document.getElementById('returnDateInput').addEventListener('input', e=>{ newOrderReturnDate = e.target.value; });
  const overrideCheckEl = document.getElementById('gradeOverrideCheck');
  if(overrideCheckEl) overrideCheckEl.addEventListener('change', e=>{ newOrderOverride.ack = e.target.checked; });
  const overrideReasonEl = document.getElementById('gradeOverrideReason');
  if(overrideReasonEl) overrideReasonEl.addEventListener('input', e=>{ newOrderOverride.reason = e.target.value; });
  const pickerList = document.getElementById('kitPickerList');
  function drawPicker(term){
    const filtered = ALL_KITS.filter(k => !term || k.name.toLowerCase().includes(term)).sort((a,b)=>a.name.localeCompare(b.name));
    pickerList.innerHTML = filtered.map(k => `<div data-add="${k.id}" style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--line-soft);">${highlightMatch(k.name, term)}</div>`).join('');
    pickerList.querySelectorAll('[data-add]').forEach(row=>{
      row.addEventListener('click', ()=>{
        newOrderKits.push({instanceId: row.dataset.add + '-' + (++newOrderInstanceCounter), kitId: row.dataset.add});
        renderNewOrderPane();
      });
    });
  }
  document.getElementById('kitPickerSearch').addEventListener('input', e => drawPicker(e.target.value.toLowerCase()));
  drawPicker('');
  content.querySelectorAll('[data-unitkit]').forEach(inp=>{
    inp.addEventListener('input', e=>{ newOrderUnitIds[e.target.dataset.unitkit] = e.target.value; });
  });
  content.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ newOrderKits = newOrderKits.filter(inst=>inst.instanceId!==btn.dataset.remove); renderNewOrderPane(); });
  });
  document.getElementById('buildChecklistBtn').addEventListener('click', ()=>{
    conditionLogAck = false;
    newOrderChecklist = {};
    newOrderKits.forEach(inst=>{
      const k = ALL_KITS.find(x=>String(x.id)===String(inst.kitId));
      const standard = (k.contents || []).map(()=>({checked:false, note:'', optional:false}));
      const perreq = (k.perreq || []).map(()=>({checked:false, note:'', optional:true}));
      newOrderChecklist[inst.instanceId] = [...standard, ...perreq];
    });
    renderChecklistArea();
  });
}

function renderChecklistArea(){
  const area = document.getElementById('checklistArea');
  if(!newOrderKits.length){ area.innerHTML = ''; return; }

  // ── Condition log gate ──────────────────────────────────────────────────
  const openIssues = newOrderKits.flatMap(inst => {
    const k = ALL_KITS.find(x=>String(x.id)===String(inst.kitId));
    const kitName = k?.name || 'Unknown kit';
    return openConditionLogs
      .filter(e => String(e.kitId) === String(inst.kitId))
      .map(e => ({ kitName, item: e.item || '', note: e.note || '', type: e.type || '' }));
  });

  let gateHtml = '';
  if(openIssues.length){
    gateHtml = `
      <div class="card" style="border-left:4px solid var(--danger); margin-bottom:14px; background:#fff8f8;">
        <div style="font-weight:700; color:var(--danger); font-size:13px; margin-bottom:8px;">
          ⚠ ${openIssues.length} open condition log ${openIssues.length===1?'issue':'issues'} on this order
        </div>
        <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:10px;">
          These issues were logged at a previous check-in. Review each one before proceeding.
        </div>
        <ul style="margin:0 0 12px 0; padding-left:20px; font-size:13px;">
          ${openIssues.map(i=>`<li><strong>${i.kitName}</strong>${i.item?' — '+i.item:''}${i.note?' : '+i.note:''}</li>`).join('')}
        </ul>
        <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer; font-size:13px;">
          <input type="checkbox" id="conditionLogAckCheck" ${conditionLogAck?'checked':''} style="margin-top:2px; flex-shrink:0;">
          <span><strong>Staff acknowledgement:</strong> I have reviewed all open issues above and am proceeding with this checkout with full knowledge of the current condition of this gear.</span>
        </label>
      </div>`;
  }
  // ────────────────────────────────────────────────────────────────────────

  let html = `<div class="card" style="margin-top:12px;">${gateHtml}<h4 style="font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; margin:0 0 14px;">Combined Checkout Checklist</h4>`;
  // Sorted alphabetically by kit name for easier scanning — a stable sort
  // keeps duplicate units of the same kit in the order they were actually
  // added, so "Unit 1 of 2" / "Unit 2 of 2" still lines up correctly.
  const sortedInstances = newOrderKits.slice().sort((a, b) => {
    const nameA = ALL_KITS.find(x=>String(x.id)===String(a.kitId))?.name || '';
    const nameB = ALL_KITS.find(x=>String(x.id)===String(b.kitId))?.name || '';
    return nameA.localeCompare(nameB);
  });
  sortedInstances.forEach((inst, idx)=>{
    const k = ALL_KITS.find(x=>String(x.id)===String(inst.kitId));
    const combinedItems = [...(k.contents || []), ...(k.perreq || [])];
    const sameKitCount = sortedInstances.filter(x=>String(x.kitId)===String(inst.kitId)).length;
    const posAmongSame = sortedInstances.slice(0, idx+1).filter(x=>String(x.kitId)===String(inst.kitId)).length;
    const dupLabel = sameKitCount > 1 ? ` — Unit ${posAmongSame} of ${sameKitCount}` : '';
    const unitNum = newOrderUnitIds[inst.instanceId];
    html += `<div style="margin-bottom:14px;"><div style="font-weight:700; margin-bottom:6px;">${k.name}${dupLabel}${unitNum ? ` <span style="color:var(--text-faint); font-weight:400;">[Unit ${unitNum}]</span>` : ''}</div>`;
    combinedItems.forEach((item,i)=>{
      const state = newOrderChecklist[inst.instanceId][i];
      html += `<div class="checklist-row" data-kit="${inst.instanceId}" data-idx="${i}">
        <input type="checkbox" ${state.checked?'checked':''} class="item-check">
        <span>${item}</span>
        ${state.optional ? '<span class="badge approval" style="margin-left:6px;">Optional / Per Request</span>' : ''}
        <input type="text" class="item-note" placeholder="note (optional)" value="${state.note}" style="margin-left:auto; font-size:12px;">
      </div>`;
    });
    html += `</div>`;
  });
  html += `
    <div class="order-field-row" style="margin-top:14px;">
      <div style="flex:1;"><label style="font-size:12px; color:var(--text-faint);">Student Signature (typed name)</label><input type="text" id="studentSigInput" placeholder="Type full name to acknowledge" style="width:100%;" value="${newOrderStudentSig}"></div>
      <div style="flex:1;"><label style="font-size:12px; color:var(--text-faint);">Staff Signature (typed name)</label><input type="text" id="staffSigInput" placeholder="Type full name" style="width:100%;" value="${newOrderStaffSig}"></div>
    </div>
    <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn" id="saveOrderBtn" type="button">💾 Save Checkout Record</button>
      <button class="btn secondary" id="saveDraftBtn" type="button">📋 Save Draft</button>
      <button class="btn secondary" id="printOrderBtn" type="button">🖨️ Print Summary</button>
    </div>
    <div style="font-size:12.5px; color:var(--text-faint); margin-top:8px;">Draft: only the staff signature is required to save — the student isn't signing yet. Both signatures are required later, when checkout is actually completed.</div>
    <div id="saveStatusMsg" style="margin-top:8px; font-size:13px;"></div>
  </div>`;
  area.innerHTML = html;

  area.querySelectorAll('.item-check').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const row = e.target.closest('[data-kit]');
      newOrderChecklist[row.dataset.kit][parseInt(row.dataset.idx)].checked = e.target.checked;
      renderChecklistArea();
    });
  });
  area.querySelectorAll('.item-note').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const row = e.target.closest('[data-kit]');
      newOrderChecklist[row.dataset.kit][parseInt(row.dataset.idx)].note = e.target.value;
    });
  });
  document.getElementById('studentSigInput').addEventListener('input', e=>{ newOrderStudentSig = e.target.value; });
  document.getElementById('staffSigInput').addEventListener('input', e=>{ newOrderStaffSig = e.target.value; });
  const ackEl = document.getElementById('conditionLogAckCheck');
  if(ackEl) ackEl.addEventListener('change', e=>{ conditionLogAck = e.target.checked; });

  document.getElementById('saveOrderBtn').addEventListener('click', saveNewOrder);
  document.getElementById('saveDraftBtn').addEventListener('click', saveDraftOrder);
  document.getElementById('printOrderBtn').addEventListener('click', ()=>printOrderSummary(buildOrderObjectDraft()));
}

function buildOrderObjectDraft(){
  const mismatches = getGradeMismatches();
  const kitsData = newOrderKits.map(inst=>{
    const k = ALL_KITS.find(x=>String(x.id)===String(inst.kitId));
    const combinedItems = [...(k.contents || []), ...(k.perreq || [])];
    return {
      kitId: inst.kitId, name:k.name, unitId: newOrderUnitIds[inst.instanceId] || '',
      items: combinedItems.map((item,i)=>({item, ...(newOrderChecklist[inst.instanceId] ? newOrderChecklist[inst.instanceId][i] : {checked:false,note:'',optional:false})}))
    };
  });
  return {
    reservationNumber: newOrderResNum.trim() || '(no reservation #)',
    studentName: newOrderStudentName.trim() || '(no name entered)',
    kits: kitsData,
    studentGradeLevel: newOrderStudentGrade,
    gradeOverride: mismatches.length ? {...newOrderOverride} : null,
    checkoutSignatureStudent: newOrderStudentSig.trim(),
    checkoutSignatureStaff: newOrderStaffSig.trim(),
    checkoutTimestamp: new Date(newOrderCheckoutDate || new Date()).toISOString(),
    expectedReturnDate: newOrderReturnDate || null,
    status: 'checked_out', archived: false,
  };
}

function getGradeMismatches(){
  if(!newOrderStudentGrade) return [];
  return newOrderKits.map(inst => ALL_KITS.find(k=>String(k.id)===String(inst.kitId))).filter(k=>k)
    .map(k => eligibility(k, newOrderStudentGrade)).filter(e => e.status === 'blocked');
}

async function saveNewOrder(){
  const statusEl = document.getElementById('saveStatusMsg');
  if(!requireStaffAuth('save a checkout record')) return;
  // Check condition log gate
  const openIssuesForOrder = newOrderKits.some(inst =>
    openConditionLogs.some(e => String(e.kitId) === String(inst.kitId))
  );
  if(openIssuesForOrder && !conditionLogAck){
    statusEl.textContent = '⚠ This order has open condition log issues that must be reviewed and acknowledged before saving. Check the box at the top of the checklist.';
    statusEl.style.color = 'var(--danger)'; return;
  }
  const mismatches = getGradeMismatches();
  if(mismatches.length && !newOrderOverride.ack){
    statusEl.textContent = '⚠ This order has a grade-eligibility conflict that hasn\'t been acknowledged. Check the override box above, or remove the flagged kit(s), before saving.';
    statusEl.style.color = 'var(--danger)'; return;
  }
  if(mismatches.length && newOrderOverride.ack && !newOrderOverride.reason.trim()){
    statusEl.textContent = '⚠ An override reason is required when overriding a grade-eligibility conflict.';
    statusEl.style.color = 'var(--danger)'; return;
  }
  const order = buildOrderObjectDraft();
  if(order.reservationNumber === '(no reservation #)'){
    statusEl.textContent = '⚠ Please enter a reservation number before saving.'; statusEl.style.color = 'var(--danger)'; return;
  }
  if(!order.checkoutSignatureStudent){
    statusEl.textContent = '⚠ Student signature (typed name) is required before saving.'; statusEl.style.color = 'var(--danger)'; return;
  }
  if(!order.checkoutSignatureStaff){
    statusEl.textContent = '⚠ Staff signature (typed name) is required before saving.'; statusEl.style.color = 'var(--danger)'; return;
  }
  try{
    await saveOrder(order);
    statusEl.textContent = `✅ Saved. Staff can look this up at check-in using reservation #${order.reservationNumber}.`;
    statusEl.style.color = 'var(--success)';
    // Reset all state so the form is clean for the next checkout
    newOrderKits = [];
    newOrderInstanceCounter = 0;
    newOrderStudentGrade = '';
    newOrderOverride = {ack:false, reason:''};
    newOrderResNum = '';
    newOrderStudentName = '';
    newOrderStudentSig = '';
    newOrderStaffSig = '';
    newOrderChecklist = {};
    conditionLogAck = false;
    setTimeout(()=>{ renderNewOrderPane(); }, 1800); // brief pause so staff can read the confirmation
  }catch(err){
    statusEl.textContent = '⚠ Could not save — ' + err.message + '. Try printing as a backup.';
    statusEl.style.color = 'var(--danger)';
  }
}

async function saveDraftOrder(){
  const statusEl = document.getElementById('saveStatusMsg');
  if(!requireStaffAuth('save a draft order')) return;
  const mismatches = getGradeMismatches();
  if(mismatches.length && !newOrderOverride.ack){
    statusEl.textContent = '⚠ This order has a grade-eligibility conflict that hasn\'t been acknowledged — even as a draft, since the student won\'t see this warning when finishing it themselves.';
    statusEl.style.color = 'var(--danger)'; return;
  }
  if(mismatches.length && newOrderOverride.ack && !newOrderOverride.reason.trim()){
    statusEl.textContent = '⚠ An override reason is required when overriding a grade-eligibility conflict.';
    statusEl.style.color = 'var(--danger)'; return;
  }
  const order = buildOrderObjectDraft();
  if(order.reservationNumber === '(no reservation #)'){
    statusEl.textContent = '⚠ Please enter a reservation number before saving.'; statusEl.style.color = 'var(--danger)'; return;
  }
  if(!order.checkoutSignatureStaff){
    statusEl.textContent = '⚠ Staff signature is required to save a draft — the student isn\'t signing at this stage.'; statusEl.style.color = 'var(--danger)'; return;
  }
  order.checkoutSignatureStudent = ''; // students don't sign at the draft stage — only staff, confirming who built it
  order.status = 'draft';
  try{
    await saveOrder(order);
    statusEl.textContent = `✅ Draft saved. Give the student reservation #${order.reservationNumber} — staff will need to pull it up with them to check off items and complete checkout (both signatures required at that point).`;
    statusEl.style.color = 'var(--success)';
  }catch(err){
    statusEl.textContent = '⚠ Could not save — ' + err.message;
    statusEl.style.color = 'var(--danger)';
  }
}

function printOrderSummary(order){
  const win = window.open('', '_blank');
  const kitsHtml = order.kits.map(k=>`
    <h3 style="margin:18px 0 6px; font-size:15px;">${k.name}${k.unitId ? ` (Unit ${k.unitId})` : ''}</h3>
    <table style="width:100%; border-collapse:collapse; font-size:13px;">
      ${k.items.map(it=>`<tr style="border-bottom:1px solid #ddd;">
        <td style="padding:4px 0; width:24px;">${it.checked?'☑':'☐'}</td>
        <td style="padding:4px 0;">${it.item}${it.optional ? ' <em>(Optional / Per Request)</em>' : ''}</td>
        <td style="padding:4px 0; color:#a00;">${it.note||''}</td>
      </tr>`).join('')}
    </table>`).join('');
  win.document.write(`
    <html><head><title>Order ${order.reservationNumber}</title>
    <style>body{font-family:Arial,sans-serif; color:#111; padding:30px; max-width:800px; margin:0 auto;}
    h1{font-size:20px; border-bottom:2px solid #111; padding-bottom:8px;}
    .meta{font-size:13px; color:#444; margin-bottom:14px;}
    .sigs{margin-top:30px; display:flex; gap:40px;}
    .sig-line{border-top:1px solid #111; margin-top:40px; padding-top:4px; width:250px; font-size:12px;}
    </style></head><body>
    <h1>Regent Equipment Office — Checkout Summary</h1>
    <div class="meta">Reservation #: <strong>${order.reservationNumber}</strong> &nbsp;|&nbsp; Student: <strong>${order.studentName}</strong> &nbsp;|&nbsp; ${new Date(order.checkoutTimestamp).toLocaleString()}</div>
    ${kitsHtml}
    <div class="sigs">
      <div><div>${order.checkoutSignatureStudent}</div><div class="sig-line">Student Signature</div></div>
      <div><div>${order.checkoutSignatureStaff}</div><div class="sig-line">Checked Out By (Staff)</div></div>

async function renderLookupPane(){
  const content = document.getElementById('orderContent');
  if(lookupOpenOrder){ renderOrderDetail(lookupOpenOrder); return; }
  content.innerHTML = `
    <input type="text" id="lookupSearch" placeholder="Reservation # or student name…" style="width:100%; margin-bottom:8px;" value="${lookupSearchTerm}">
    <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-faint); margin-bottom:12px;">
      <input type="checkbox" id="showArchivedCheck" ${lookupShowArchived ? 'checked' : ''}>
      Include archived (completed) orders
    </label>
    <div id="lookupResults"></div>
  `;
  document.getElementById('lookupSearch').addEventListener('input', e=>{ lookupSearchTerm = e.target.value; drawResults(); });
  document.getElementById('showArchivedCheck').addEventListener('change', e=>{ lookupShowArchived = e.target.checked; drawResults(); });
  async function drawResults(){
    const resultsEl = document.getElementById('lookupResults');
    if(lookupSearchTerm.length < 3){ resultsEl.innerHTML = '<div class="empty-state">Type at least 3 characters to search.</div>'; return; }
    const orders = await listOrders(lookupSearchTerm, lookupShowArchived);
    resultsEl.innerHTML = orders.length ? orders.map(o => `
      <div class="kit-card" data-open="${o.reservationNumber}" style="cursor:pointer;">
        <strong>${highlightMatch(o.reservationNumber, lookupSearchTerm)}</strong> — ${highlightMatch(o.studentName, lookupSearchTerm)}
        <span class="status-badge">${(o.status||'').replace('_',' ')}</span>
        ${o.archived ? '<span class="status-badge" style="background:#6E6C61; color:#fff;">ARCHIVED</span>' : ''}
      </div>
    `).join('') : `<div class="empty-state">No matches${lookupShowArchived ? '' : ' (archived orders are hidden — check the box above to include them)'}.</div>`;
    resultsEl.querySelectorAll('[data-open]').forEach(row=>{
      row.addEventListener('click', ()=>{ lookupOpenOrder = row.dataset.open; renderOrdersPage(); });
    });
  }
  drawResults();
}

        `).join('')}

    document.getElementById('backBtn').addEventListener('click', ()=>{ lookupOpenOrder = null; renderOrdersPage(); });
    content.querySelectorAll('.draft-item-check').forEach(cb=>{

      });
    });
    content.querySelectorAll('.draft-item-note').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const row = e.target.closest('[data-ki]');

      });
    });
    document.getElementById('draftStudentSig').addEventListener('input', e=>{ studentSig = e.target.value; });
    document.getElementById('draftStaffSig').addEventListener('input', e=>{ staffSig = e.target.value; });
    document.getElementById('finishDraftBtn').addEventListener('click', async ()=>{
      const statusEl = document.getElementById('draftStatusMsg');
      if(!studentSig.trim()){
        statusEl.textContent = '⚠ Student signature is required before finishing checkout.';
        statusEl.style.color = 'var(--danger)';
        return;
      }
      if(!staffSig.trim()){
        statusEl.textContent = '⚠ Staff signature is required before finishing checkout.';
        statusEl.style.color = 'var(--danger)';
        return;
      }
      order.checkoutSignatureStudent = studentSig.trim();
      order.checkoutSignatureStaff = staffSig.trim();
      order.status = 'checked_out';
      order.checkoutTimestamp = new Date().toISOString();
      try{
        await saveOrder(order);
        statusEl.textContent = '✅ Checkout complete.';
        statusEl.style.color = 'var(--success)';
        setTimeout(()=>renderOrderDetail(order.reservationNumber), 600);
      }catch(err){
        statusEl.textContent = '⚠ Could not save — ' + err.message;
        statusEl.style.color = 'var(--danger)';
      }
    });
  }
  draw();
}

    return;

    content.innerHTML = `

        ${(order.kits||[]).map((k, ki) => `
          <div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--line-soft);">
            <div style="font-weight:700; margin-bottom:6px;">${k.name}${k.unitId ? ` [Unit ${k.unitId}]` : ''}</div>

              return `
              <div class="checklist-row" style="cursor:default; flex-wrap:wrap;">

                ${it.note ? `<span style="margin-left:8px; color:var(--danger); font-size:12.5px;">⚠ ${it.note}</span>` : ''}
                ${order.status === 'checked_in' ? `
                  ${issueDef ? `<span class="badge blocked" style="margin-left:auto;">${issueDef.label}${it.replacementCost ? ' — $'+it.replacementCost : ''}${it.confirmedLost ? ' (confirmed lost)' : ''}</span>` : `<button class="media-btn" data-flag-toggle="${key}" type="button" style="margin-left:auto;">🚩 Flag Issue</button>`}
                ` : ''}
              </div>
              ${flagOpenKey === key ? `
                <div class="checklist-row" data-flag-form="${key}">
                  <select data-flag-select="${key}" style="font-size:12px;">
                    ${Object.entries(CHECKIN_ISSUE_TYPES).filter(([k])=>k).map(([val,def]) => `<option value="${val}">${def.label}</option>`).join('')}
                  </select>
                  <input type="number" data-flag-cost="${key}" placeholder="$ cost (if needed)" style="width:110px; font-size:12px;">
                  <button class="btn secondary" data-flag-save="${key}" type="button" style="font-size:12px; padding:5px 10px;">Save</button>

                </div>

          <div>Staff signature (checkout): <strong style="color:var(--text);">${order.checkoutSignatureStaff || '(none recorded)'}</strong></div>
          ${order.status === 'checked_in' ? `<div>Staff signature (check-in): <strong style="color:var(--text);">${order.checkinSignatureStaff || '(none recorded)'}</strong></div>` : ''}

        ${order.status === 'checked_in' ? `
          <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn secondary" id="archiveBtn" type="button">${order.archived ? '↩ Un-archive this order' : '📦 Archive this order'}</button>

    if(archiveBtn){
