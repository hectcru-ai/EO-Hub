<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EO Hub — Patch: ARRI 1000w Kit Contents</title>
<style>
  body{font-family:-apple-system,sans-serif; max-width:700px; margin:60px auto; padding:0 20px; color:#28271F;}
  h1{font-size:22px;}
  button{background:#C6862A; color:#fff; border:none; border-radius:6px; padding:12px 22px; font-size:15px; cursor:pointer;}
  button:hover{background:#8A662C;}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  input{padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; width:100%; margin-bottom:10px; box-sizing:border-box;}
  #log{margin-top:24px; padding:16px; border-radius:6px; font-family:monospace; font-size:13px; white-space:pre-wrap; background:#f4f1ea; border:1px solid #ccc; max-height:400px; overflow-y:auto;}
  .warn{background:#fff8e6; border:1px solid #C6862A; padding:14px; border-radius:6px; margin-bottom:20px;}
</style>
</head>
<body>

<h1>Patch: ARRI 1000w Kit Contents</h1>
<div class="warn">
  ⚠ Run this <strong>once</strong>. It adds the missing 300w and (2) 650w Fresnel Lights, plus their barndoors, to the ARRI 1000w Kit's Standard Contents. Delete or stop using this file after it succeeds.
</div>

<div id="loginArea">
  <input type="email" id="loginEmail" placeholder="Staff email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button id="loginBtn">Log In</button>
  <div id="loginStatus" style="margin-top:8px; font-size:13px;"></div>
</div>

<button id="patchBtn" disabled>Apply Patch (log in first)</button>
<div id="log">Log in as staff, then click the button to begin.</div>

<script type="module">
  import { db, signInStaff } from "./firebase-data.js";
  import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

  const logEl = document.getElementById('log');
  const patchBtn = document.getElementById('patchBtn');
  const loginBtn = document.getElementById('loginBtn');
  const loginStatus = document.getElementById('loginStatus');

  function log(msg){
    logEl.textContent += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    try{
      await signInStaff(email, password);
      loginStatus.textContent = '✅ Logged in.';
      patchBtn.disabled = false;
      patchBtn.textContent = 'Apply Patch';
    }catch(e){
      loginStatus.textContent = '⚠ Login failed — check email/password.';
    }
  });

  const NEW_CONTENTS = [
    "1000 Watt Fresnel Lights",
    "300 Watt Fresnel Lights",
    "(2) 650 Watt Fresnel Lights",
    "Barndoors for 1000w",
    "Barndoors for 300w",
    "Barndoors for 650w",
    "Half Scrims (silver)",
    "Single Scrims (green)",
    "Double Scrims (red)",
    "Scrim Bag",
    "ARRI Stands"
  ];

  patchBtn.addEventListener('click', async () => {
    patchBtn.disabled = true;
    logEl.textContent = '';
    log('Starting...\n');
    try{
      await updateDoc(doc(db, 'kits', '10'), { contents: NEW_CONTENTS });
      log('✅ Updated [10] ARRI 1000w Kit');
      log('\nDone. All changes applied successfully. You can stop using this file now.');
    }catch(err){
      log('❌ ARRI 1000w Kit — ' + err.message);
      log('\n⚠ Update failed — check the error above.');
    }
    patchBtn.disabled = false;
  });
</script>

</body>
</html>
